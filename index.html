<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Livre</title>
<meta name="theme-color" content="#1B1C1E">
<meta name="apple-mobile-web-app-title" content="Grand Livre">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    color-scheme:dark;
    --bg:#1B1C1E; --bg-raised:#222325; --bg-sunken:#28292C; --line:#404144;
    --ink:#EFEFEB; --ink-soft:#C4C4C2; --ink-faint:#AAAAAA;
    --forest:#AFCCBA; --forest-soft:#29352E; --clay:#E7B0A3; --clay-soft:#392B28;
    --caramel:#DEC498; --caramel-soft:#373127; --sage:#AFCCBA;
    --action:#E7E7E3; --on-action:#1B1C1E;
    --radius:2px; --radius-sm:2px; --radius-pill:2px;
    --mono:'Consolas','Liberation Mono',monospace;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#F4F4F0; --bg-raised:#FFFFFF; --bg-sunken:#EAEAE6; --line:#CECECA;
    --ink:#202123; --ink-soft:#515255; --ink-faint:#606164;
    --forest:#326247; --forest-soft:#E4EEE6; --clay:#9C4334; --clay-soft:#F4E5E0;
    --caramel:#775918; --caramel-soft:#F2EBD9; --sage:#326247;
    --action:#222325; --on-action:#FFFFFF;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  body{margin:0; background:var(--bg); color:var(--ink); font:13px/1.6 Arial,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0; font-family:'Arial Black','Segoe UI',sans-serif; font-weight:900; text-transform:uppercase; line-height:1.2; letter-spacing:.025em; text-wrap:balance;}
  h1{font-size:32px;} h1::after{content:'.';}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink-soft);} .faint{color:var(--ink-faint);} .small{font-size:12px;}
  a{color:inherit;} button,input,select,textarea{font:inherit;}
  button{cursor:pointer;} button:disabled{cursor:not-allowed;opacity:.5;}
  :focus-visible{outline:2px solid var(--ink);outline-offset:4px;}
  .app{min-height:100vh;}
  .sidebar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px;padding:20px 48px 0;border-bottom:1px solid var(--line);background:var(--bg);}
  .brand{display:flex;align-items:center;gap:24px;}
  .brand-mark{font-family:'Arial Black',sans-serif;font-weight:900;font-size:19px;line-height:.87;letter-spacing:-1px;}
  .brand-name{display:block;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
  .brand-subtitle{display:block;font-size:10px;letter-spacing:.12em;color:var(--ink-soft);margin-top:3px;}
  .nav-list{display:flex;grid-column:1/-1;grid-row:2;gap:30px;overflow-x:auto;scrollbar-width:thin;}
  .nav-btn{display:flex;align-items:center;gap:10px;flex:none;padding:13px 0 17px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--ink-soft);font:11px var(--mono);text-transform:uppercase;letter-spacing:.09em;white-space:nowrap;}
  .nav-btn svg{display:none;}
  .nav-btn:hover{color:var(--ink);}
  .nav-btn.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:700;}
  .nav-number{font-size:10px;}
  .sidebar-foot{display:flex;align-items:center;gap:20px;grid-column:2;grid-row:1;}
  .theme-toggle{min-width:90px;min-height:38px;border:1px solid var(--line);color:var(--ink);background:transparent;font:11px var(--mono);}
  .theme-toggle:hover{background:var(--bg-sunken);}
  .sync-chip{display:flex;align-items:center;gap:8px;border:0;padding:8px 0;background:transparent;color:var(--ink-faint);font:10px var(--mono);cursor:pointer;}
  .sync-chip:hover{color:var(--ink);}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex:none;}
  .sync-chip.is-idle .sync-dot{background:var(--forest);}
  .sync-chip.is-error .sync-dot{background:var(--clay);}
  .sync-chip.is-syncing .sync-dot,.sync-chip.is-offline .sync-dot{background:var(--caramel);}
  .sync-chip.is-syncing .sync-dot{animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35;}}
  .topnav{display:none;}
  .main{min-width:0;background:linear-gradient(115deg,var(--bg-raised),var(--bg) 65%);}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:0 32px;padding:26px 0 20px;border-bottom:1px solid var(--line);}
  .page-heading{display:flex;flex-direction:column;gap:11px;min-width:0;}
  .eyebrow{font:10px var(--mono);letter-spacing:.23em;color:var(--ink-faint);text-transform:uppercase;}
  .heading-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .topbar-actions{display:flex;align-items:center;gap:26px;}
  .page-description{color:var(--ink-soft);font-size:12px;max-width:210px;margin:0;}
  .content{padding:20px 32px 56px;max-width:1600px;width:100%;margin:0 auto;}
  .card{background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--radius);}
  .card-pad,.form-card{padding:24px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 18px;border:1px solid var(--line);border-radius:2px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;}
  .btn svg{width:15px;height:15px;flex:none;}
  .btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action);}
  .btn-primary:hover{opacity:.85;}
  :root:not([data-theme="light"]) .btn-primary{background:#383D44;color:#E3E5E8;border-color:#68717D;}
  :root:not([data-theme="light"]) .btn-primary:not(:disabled):hover{background:#454C55;border-color:#7B8592;opacity:1;}
  .btn-ghost{background:transparent;color:var(--ink);}
  .btn-ghost:hover{background:var(--bg-sunken);}
  .btn-sm{min-height:36px;padding:8px 12px;font-size:10px;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--ink-soft);}
  .icon-btn svg{width:15px;height:15px;}
  .icon-btn:hover{background:var(--bg-sunken);color:var(--ink);}
  .icon-btn.danger-armed{width:auto;padding:0 10px;background:var(--clay-soft);color:var(--clay);border-color:var(--clay);font-size:11px;font-weight:700;}
  .page-head{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:20px;}
  .page-head p{margin:0;max-width:720px;}
  .hero{padding:32px;margin-bottom:16px;display:flex;flex-direction:column;justify-content:center;min-height:240px;background:linear-gradient(120deg,var(--bg-sunken),var(--bg-raised));}
  .hero-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--ink-faint);}
  .hero-value{font-size:clamp(32px,4.6vw,64px);font-weight:700;line-height:1.2;letter-spacing:-.055em;margin:20px 0 12px;}
  .hero-accounts{display:flex;flex-wrap:wrap;gap:12px 24px;padding-top:20px;margin-top:12px;border-top:1px solid var(--line);}
  .acc-pill{display:flex;align-items:center;gap:7px;font-size:12px;}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px;}
  .stat-tile{padding:24px;}
  .stat-value{font-size:26px;margin-top:12px;letter-spacing:-.03em;}
  .stat-tile.income .stat-value,.amt.pos,.rec-amount.pos,.rec-account .mono.pos,.rec-group-total.pos,.charge-amount.pos{color:var(--forest);}
  .stat-tile.expense .stat-value,.amt.neg,.rec-amount.neg,.rec-account .mono.neg,.rec-group-total.neg,.charge-amount.neg{color:var(--clay);}
  .chart-card,.panel{padding:24px;margin-bottom:16px;min-width:0;}
  .chart-card h3,.panel h3,.form-card h3{font-size:13px;margin-bottom:20px;}
  .chart-card{display:flex;flex-direction:column;justify-content:center;}
  .bar-row{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto;gap:12px;align-items:center;margin:12px 0;font-size:12px;}
  .bar-row>span{overflow-wrap:anywhere;}
  .bar-track{height:3px;background:var(--bg-sunken);overflow:hidden;}
  .bar-fill{height:100%;}
  .bar-row .amt{text-align:right;white-space:nowrap;}
  .content[data-page="dashboard"]{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;}
  .content[data-page="dashboard"]>.card,.content[data-page="dashboard"]>.stat-row{margin-bottom:0;}
  .content[data-page="dashboard"]>.hero{grid-column:1;grid-row:1;}
  .content[data-page="dashboard"]>.chart-card{grid-column:2;grid-row:1;}
  .content[data-page="dashboard"]>.stat-row,.content[data-page="dashboard"]>.panel:last-child{grid-column:1/-1;}
  .rec-summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:20px 48px;padding:28px;margin-bottom:20px;}
  .rec-figure{display:flex;flex-direction:column;gap:8px;}
  .rec-amount{font-size:28px;letter-spacing:-.025em;}
  .rec-note{flex-basis:100%;margin:0;}
  .rec-accounts{flex-basis:100%;display:flex;flex-wrap:wrap;gap:12px 24px;padding-top:18px;border-top:1px solid var(--line);}
  .rec-account{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);}
  .rec-groupby{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .rec-groupby>.faint{margin-right:8px;}
  .rec-group{padding:6px 24px 8px;margin-bottom:16px;}
  .rec-group-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);}
  .rec-group-name{display:inline-flex;align-items:center;gap:8px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.12em;}
  .rec-group-total{font-size:15px;}
  .budget-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);}
  .budget-row:last-child{border:0;}
  .budget-cat{font-weight:700;font-size:14px;overflow-wrap:anywhere;}
  .budget-nums{color:var(--ink-faint);font-size:12px;margin-top:5px;}
  .charges-card{padding:6px 24px 18px;}
  .charge-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);}
  .charge-row:last-child{border-bottom:0;}
  .charge-name{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:14px;font-weight:700;overflow-wrap:anywhere;min-width:0;}
  .charge-amount{font-size:16px;white-space:nowrap;}
  .charge-actions{display:flex;gap:8px;}
  .charge-row-add,.charge-row-edit{grid-template-columns:minmax(0,1fr) 120px 130px auto;}
  .charge-row-add{padding-top:20px;}
  .charge-row-edit{background:var(--bg-sunken);padding:16px;margin:8px 0;}
  .empty{padding:40px 24px;text-align:center;color:var(--ink-faint);font-size:13px;}
  .empty svg{width:30px;height:30px;margin-bottom:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--ink-faint);font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;}
  tbody td{padding:16px;border-bottom:1px solid var(--line);}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr:hover{background:var(--bg-sunken);}
  td.amt{text-align:right;font-family:var(--mono);white-space:nowrap;}
  td.actions{text-align:right;white-space:nowrap;}
  td.actions .icon-btn{margin-left:6px;}
  .cat-chip{display:inline-block;padding:3px 7px;border:1px solid var(--line);font-size:11px;font-weight:400;color:var(--ink-soft);}
  .rec-badge svg{width:12px;height:12px;margin-right:4px;vertical-align:-2px;}
  .table-wrap{overflow-x:auto;}
  .form-card{margin-bottom:20px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px;min-width:0;}
  .field label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
  .field input,.field select,.field textarea,.charge-row input,.charge-row select,.filters input,.filters select{width:100%;min-width:0;min-height:44px;padding:11px 12px;border:1px solid var(--line);border-radius:2px;background:var(--bg-sunken);color:var(--ink);}
  input::placeholder{color:var(--ink-faint);opacity:1;}
  .field input:focus,.field select:focus,.type-opt input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px;}
  .form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .type-toggle{display:flex;gap:10px;}
  .type-opt{position:relative;}
  .type-opt input{position:absolute;opacity:0;inset:0;cursor:pointer;}
  .type-opt span{display:block;padding:11px 16px;border:1px solid var(--line);color:var(--ink-soft);}
  .type-opt input:checked+span.expense{background:var(--clay-soft);border-color:var(--clay);color:var(--clay);}
  .type-opt input:checked+span.income{background:var(--forest-soft);border-color:var(--forest);color:var(--forest);}
  .swatches{display:flex;gap:10px;}
  .swatch{width:32px;height:32px;position:relative;border:2px solid transparent;}
  .swatch input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .swatch.selected{border-color:var(--ink);}
  .swatch:focus-within{outline:2px solid var(--ink);outline-offset:3px;}
  .accounts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px;}
  .account-card{padding:28px;position:relative;border-top:2px solid var(--forest);}
  .acc-type{font:10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);padding-right:78px;}
  .acc-name{font-weight:800;font-size:20px;margin:18px 0 8px;overflow-wrap:anywhere;}
  .acc-balance{font-size:30px;letter-spacing:-.03em;}
  .acc-meta{font-size:12px;color:var(--ink-faint);margin-top:18px;}
  .acc-actions{position:absolute;top:18px;right:18px;display:flex;gap:6px;}
  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px;}
  .filters select{flex:1 1 160px;width:auto;}
  .filters input{flex:1.5 1 220px;width:auto;}
  .settings-section{margin-bottom:20px;}
  .settings-section h3{font-size:14px;margin-bottom:10px;}
  .settings-section p.lead{margin:0 0 20px;color:var(--ink-soft);max-width:850px;}
  .sync-state{display:flex;align-items:flex-start;gap:12px;padding:16px;margin-bottom:20px;background:var(--bg-sunken);}
  .sync-state svg{width:18px;height:18px;flex:none;margin-top:2px;}
  .sync-state.ok{color:var(--forest);} .sync-state.warn{color:var(--caramel);} .sync-state.bad{color:var(--clay);}
  .sync-state-sub{display:block;color:var(--ink-faint);font-size:12px;margin-top:4px;}
  .banner,.backup-banner{margin:16px 32px 0;padding:16px 20px;border:1px solid var(--line);}
  .banner{color:var(--caramel);background:var(--caramel-soft);}
  .backup-banner{display:flex;flex-wrap:wrap;align-items:center;gap:16px;background:var(--bg-raised);border-left:2px solid var(--caramel);}
  .backup-text{flex:1;min-width:200px;}
  .backup-text strong{display:block;} .backup-text span{color:var(--ink-faint);font-size:12px;}
  .backup-actions{display:flex;gap:10px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;max-width:min(90vw,440px);padding:14px 20px;background:var(--action);color:var(--on-action);border:1px solid var(--line);font-size:12px;text-align:center;box-shadow:0 12px 40px #0003;}
  .toast-error{background:var(--clay-soft);color:var(--clay);border-color:var(--clay);}
  .offline-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;color:var(--caramel);background:var(--caramel-soft);font:10px var(--mono);text-transform:uppercase;}
  .offline-badge::before{content:'';width:5px;height:5px;background:var(--caramel);border-radius:50%;}
  .modal-overlay{position:fixed;inset:0;background:#0009;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-card{max-width:460px;width:100%;padding:28px;max-height:90vh;overflow:auto;}
  .modal-card h3{font-size:18px;}
  @media(min-width:1600px){.topbar{max-width:1536px;width:calc(100% - 64px);margin-inline:auto;}}
  @media(max-width:1050px){.sidebar{padding-inline:32px;}.nav-list{gap:22px;}.page-description{display:none;}.hero-value{font-size:40px;}.sync-chip{max-width:190px;}}
  @media(max-width:820px){
    .sidebar{padding:18px 20px 0;gap:18px;}.brand{gap:14px;}.brand-name{font-size:12px;}.sidebar-foot{gap:12px;}.sync-chip{max-width:150px;line-height:1.4;}.nav-list{gap:24px;}.nav-btn{min-height:44px;}
    .topbar{margin:0 20px;padding:24px 0 20px;flex-wrap:wrap;gap:18px;}h1{font-size:26px;}.topbar-actions{width:100%;}.topbar-actions>.btn{width:100%;}
    .content{padding:20px 20px 40px;}.content[data-page="dashboard"]{display:flex;flex-direction:column;}.hero{padding:26px;min-height:220px;}.hero-value{font-size:clamp(28px,7vw,44px);}.stat-row{gap:10px;}.stat-tile{padding:18px 12px;}.stat-value{font-size:20px;}.hero-label{font-size:9px;letter-spacing:.09em;}
    .page-head{flex-wrap:wrap;gap:16px;}.page-head>.btn{width:100%;}.field-grid{grid-template-columns:1fr;gap:0;}.field input,.field select,.charge-row input,.charge-row select,.filters input,.filters select{font-size:16px;}
    .budget-row{grid-template-columns:minmax(0,1fr) auto;gap:12px;}.budget-row>div:first-child{grid-column:1/-1;}.budget-row>.amt{grid-column:1;}.budget-row>.icon-btn{grid-column:2;}.budget-row>div:last-child{grid-column:1/-1;justify-content:flex-end;}.icon-btn{width:44px;height:44px;}
    .charge-row{grid-template-columns:minmax(0,1fr) auto;}.charge-name{grid-column:1/-1;}.charge-actions{justify-content:flex-end;}.charge-row-add,.charge-row-edit{grid-template-columns:1fr 1fr;}.charge-row-add>input[type=text],.charge-row-edit>input[type=text],.charge-row-add>.charge-actions,.charge-row-edit>.charge-actions{grid-column:1/-1;}.charge-actions .btn{flex:1;}
    .rec-summary{padding:24px;gap:20px 32px;}.rec-group{padding-inline:18px;}.banner,.backup-banner{margin-inline:20px;}.backup-actions{flex-wrap:wrap;width:100%;}.backup-actions>.btn{flex:1;}.form-card,.card-pad{padding:20px;}.bar-row{grid-template-columns:minmax(65px,1fr) minmax(40px,1fr) auto;gap:8px;}
  }
  @media(max-width:480px){.sync-chip{max-width:105px;font-size:9px;}.theme-toggle{min-width:66px;}.brand-subtitle{font-size:9px;letter-spacing:.04em;}.stat-row{grid-template-columns:1fr;}.stat-tile{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;gap:12px;}.stat-value{margin:0;}.hero-accounts{flex-direction:column;}.chart-card,.panel{padding:20px;}.rec-group-head{align-items:flex-start;}.rec-group-name{overflow-wrap:anywhere;}.acc-balance{font-size:26px;}}
  @media(max-width:480px){
    .content[data-page="dashboard"] .table-wrap table,.content[data-page="dashboard"] .table-wrap tbody{display:block;}
    .content[data-page="dashboard"] .table-wrap tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;padding:16px 0;border-bottom:1px solid var(--line);}
    .content[data-page="dashboard"] .table-wrap tr:last-child{border-bottom:0;}
    .content[data-page="dashboard"] .table-wrap td{padding:0;border:0;grid-column:1;}
    .content[data-page="dashboard"] .table-wrap td.amt{grid-column:2;grid-row:1/4;align-self:center;}
  }
  /* Fondus de navigation : le cadre reste stable, seul le contenu change. */
  @keyframes fade-out{to{opacity:0;}}
  @keyframes fade-in{from{opacity:0;}}
  html[data-transition-scope="content"] .content{view-transition-name:page-content;}
  html[data-transition-scope="content"] .heading-line{view-transition-name:page-heading;}
  ::view-transition-old(root),::view-transition-old(page-content),::view-transition-old(page-heading){animation:140ms ease-out both fade-out;}
  ::view-transition-new(root),::view-transition-new(page-content),::view-transition-new(page-heading){animation:220ms ease-out both fade-in;}
  html[data-transition-scope="content"]::view-transition-old(root),html[data-transition-scope="content"]::view-transition-new(root){animation:none;}
  ::view-transition-group(*){animation-duration:220ms;}
  ::view-transition{pointer-events:none;}
  .btn,.icon-btn,.theme-toggle,.nav-btn,.type-opt span{transition:background-color 140ms ease,color 140ms ease,border-color 140ms ease,opacity 140ms ease;}
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important;}
    ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important;}
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="sidebar" id="sidebar">

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
var EXPENSE_CATS = ['Logement','Alimentation','Transport','Santé','Loisirs','Shopping','Abonnements','Assurance','Éducation','Autres dépenses'];
var INCOME_CATS = ['Salaire','Freelance','Remboursement','Cadeau','Autres revenus'];
var ACCOUNT_TYPES = ['Compte courant','Livret / Épargne','Espèces','Autre'];
/* Couleurs de compte : tons doux, assez distincts pour se reconnaître d'un
   coup d'œil, assez sourds pour rester lisibles sur fond clair comme sombre. */
var PALETTE = ['#2E5A4E','#D3A373','#7E8C5A','#B5674A','#5E8079','#A88B5B'];
var NAV = [
  {id:'dashboard', label:'Vue d’ensemble', icon:'grid'},
  {id:'transactions', label:'Transactions', icon:'swap'},
  {id:'recurring', label:'Récurrent', icon:'repeat'},
  {id:'accounts', label:'Comptes', icon:'wallet'},
  {id:'charges', label:'Compte Charge', icon:'receipt'},
  {id:'settings', label:'Réglages', icon:'gear'}
];

/* ---------- icons ---------- */
function icon(name){
  var p = {
    grid:'<rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>',
    swap:'<path d="M4 8h13l-3.2-3.2"/><path d="M20 16H7l3.2 3.2"/>',
    wallet:'<rect x="3" y="6.5" width="18" height="12" rx="2.2"/><path d="M3 10.5h18"/><circle cx="16.8" cy="14.5" r="1.1" fill="currentColor" stroke="none"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    edit:'<path d="M4 20l.9-4 11-11a1.6 1.6 0 0 1 2.3 0l.8.8a1.6 1.6 0 0 1 0 2.3L8 19l-4 1Z"/>',
    trash:'<path d="M4.5 7h15M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7m-8 0 .9 12.3a1.2 1.2 0 0 0 1.2 1.1h6.4a1.2 1.2 0 0 0 1.2-1.1L16.5 7"/>',
    repeat:'<path d="M17 2.5l4 4-4 4"/><path d="M3 11.5v-1a4 4 0 0 1 4-4h14"/><path d="M7 21.5l-4-4 4-4"/><path d="M21 12.5v1a4 4 0 0 1-4 4H3"/>',

    book:'<path d="M4 5.2C4 4.5 4.6 4 5.3 4H12v16H5.3c-.7 0-1.3-.5-1.3-1.2V5.2Z"/><path d="M20 5.2C20 4.5 19.4 4 18.7 4H12v16h6.7c.7 0 1.3-.5 1.3-1.2V5.2Z"/>',
    receipt:'<path d="M6 3.2h12a.8.8 0 0 1 .8.8v16.3l-2.6-1.5-2.6 1.5-2.6-1.5-2.6 1.5-2.6-1.5V4a.8.8 0 0 1 .8-.8Z"/><path d="M9 8.2h6"/><path d="M9 12.2h6"/>',
    gear:'<circle cx="12" cy="12" r="3.1"/><path d="M19.4 14.5a1.5 1.5 0 0 0 .3 1.7l.1.1a1.8 1.8 0 1 1-2.6 2.6l-.1-.1a1.5 1.5 0 0 0-1.7-.3 1.5 1.5 0 0 0-.9 1.4v.2a1.8 1.8 0 1 1-3.6 0v-.1a1.5 1.5 0 0 0-1-1.4 1.5 1.5 0 0 0-1.7.3l-.1.1a1.8 1.8 0 1 1-2.6-2.6l.1-.1a1.5 1.5 0 0 0 .3-1.7 1.5 1.5 0 0 0-1.4-.9h-.2a1.8 1.8 0 1 1 0-3.6h.1a1.5 1.5 0 0 0 1.4-1 1.5 1.5 0 0 0-.3-1.7l-.1-.1a1.8 1.8 0 1 1 2.6-2.6l.1.1a1.5 1.5 0 0 0 1.7.3h.1a1.5 1.5 0 0 0 .9-1.4v-.2a1.8 1.8 0 1 1 3.6 0v.1a1.5 1.5 0 0 0 .9 1.4 1.5 1.5 0 0 0 1.7-.3l.1-.1a1.8 1.8 0 1 1 2.6 2.6l-.1.1a1.5 1.5 0 0 0-.3 1.7v.1a1.5 1.5 0 0 0 1.4.9h.2a1.8 1.8 0 1 1 0 3.6h-.1a1.5 1.5 0 0 0-1.4.9Z"/>',
    cloud:'<path d="M17.5 18.5H7a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.5 1.6 3.7 3.7 0 0 1-.4 7.4Z"/>',
    check:'<path d="M4.5 12.5l5 5 10-11"/>',
    alert:'<path d="M12 8.5v5"/><circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/><path d="M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20.2h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>'
  };
  return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(p[name]||'')+'</svg>';
}

/* ---------- state ---------- */
var STORAGE_KEY = 'grand-livre-data-v1';
var SYNC_KEY = 'grand-livre-sync-v1';
var UI_KEY = 'grand-livre-ui-v1';
var state = {
  page:'dashboard',
  accounts:[],
  transactions:[],
  recurring:[],
  charges:[],          /* lignes du compte charges, indépendantes des transactions */
  budget:{targets:{}, updatedAt:0},
  /* Ce qui a été supprimé, et quand. Sans cette trace, une suppression faite
     sur un appareil serait ressuscitée par l'autre à la fusion suivante. */
  tombstones:{accounts:{}, transactions:{}, recurring:{}, charges:{}},
  meta:{lastExportAt:null, snoozeUntil:null},
  loaded:false,
  storageAvailable:true,
  showAccountForm:false, editAccountId:null,
  showTxForm:false, editTxId:null,
  showRecurringForm:false, editRecurringId:null,
  txFilters:{account:'all', category:'all', type:'all', search:''},
  editChargeId:null,
  theme:'dark',
  recGroupBy:'category'   /* 'category' | 'account' — préférence d'affichage, propre à l'appareil */
};
var armed = new Set();

/* Réglages de synchronisation. Le jeton reste sur cet appareil : il n'est
   envoyé qu'à api.github.com, jamais ailleurs. */
var sync = {
  token:'', owner:'', repo:'', path:'grand-livre.json', branch:'main',
  sha:null,            /* version du fichier distant vue en dernier */
  lastSyncAt:null,
  status:'off',        /* off | idle | syncing | error | offline */
  message:'',
  dirty:false          /* des changements locaux attendent d'être envoyés */
};
var syncTimer = null;

function now(){ return Date.now(); }
function stamp(rec){ rec.updatedAt = now(); return rec; }
function tombs(kind){
  if(!state.tombstones) state.tombstones = {accounts:{}, transactions:{}, recurring:{}, charges:{}};
  if(!state.tombstones[kind]) state.tombstones[kind] = {};
  return state.tombstones[kind];
}
function markDeleted(kind, id){ tombs(kind)[id] = now(); }

/* ---------- utils ---------- */
function fmtMoney(n){
  return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n||0);
}
function fmtDate(iso){
  var d = new Date(iso+'T00:00:00');
  return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'short',year:'numeric'}).format(d);
}
function todayStr(){
  var d = new Date(); var tz = d.getTimezoneOffset();
  return new Date(d.getTime()-tz*60000).toISOString().slice(0,10);
}
function monthKeyOf(iso){ return iso.slice(0,7); }
function currentMonthKey(){ return todayStr().slice(0,7); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uniq(arr){ return arr.filter(function(v,i){ return arr.indexOf(v)===i; }); }

function signedAmount(tx){ return tx.type==='income' ? tx.amount : -tx.amount; }

function accountBalance(acc){
  var sum = acc.initialBalance||0;
  var today = todayStr();
  state.transactions.forEach(function(tx){ if(tx.accountId===acc.id && tx.date<=today) sum += signedAmount(tx); });
  return sum;
}
function totalBalance(){
  var sum = 0;
  var today = todayStr();
  state.accounts.forEach(function(a){ sum += (a.initialBalance||0); });
  state.transactions.forEach(function(tx){ if(tx.date<=today) sum += signedAmount(tx); });
  return sum;
}
function computeBalanceAt(cutoffIso){
  var sum = 0;
  state.accounts.forEach(function(a){ sum += (a.initialBalance||0); });
  state.transactions.forEach(function(tx){ if(tx.date<=cutoffIso) sum += signedAmount(tx); });
  return sum;
}
function monthTx(monthKey, type){
  return state.transactions.filter(function(tx){ return monthKeyOf(tx.date)===monthKey && (!type || tx.type===type); });
}
function monthSum(monthKey, type){
  return monthTx(monthKey, type).reduce(function(s,tx){ return s+tx.amount; },0);
}
function categorySpend(monthKey){
  var map = {};
  monthTx(monthKey,'expense').forEach(function(tx){ map[tx.category] = (map[tx.category]||0)+tx.amount; });
  return map;
}
function allExpenseCategories(){
  var used = state.transactions.filter(function(t){return t.type==='expense';}).map(function(t){return t.category;});
  var rec = state.recurring.filter(function(r){return r.type==='expense';}).map(function(r){return r.category;});
  var targeted = Object.keys(state.budget.targets||{});
  return uniq(EXPENSE_CATS.concat(used).concat(rec).concat(targeted));
}
function allIncomeCategories(){
  var used = state.transactions.filter(function(t){return t.type==='income';}).map(function(t){return t.category;});
  var rec = state.recurring.filter(function(r){return r.type==='income';}).map(function(r){return r.category;});
  return uniq(INCOME_CATS.concat(used).concat(rec));
}
function accountName(id){ var a = state.accounts.find(function(x){return x.id===id;}); return a? a.name : '—'; }
function accountColor(id){ var a = state.accounts.find(function(x){return x.id===id;}); return a? a.color : '#999'; }

function showToast(msg, isError){
  var t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; t.hidden = true; document.body.appendChild(t); }
  t.textContent = msg;
  t.className = 'toast' + (isError?' toast-error':'');
  t.hidden = false;
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.hidden = true; }, isError ? 7000 : 3200);
}
function genId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

/* ---------- local storage persistence ---------- */
function showStorageBanner(msg){
  var b = document.getElementById('db-banner');
  if(!b) return;
  b.hidden = false;
  b.textContent = msg || "Le stockage de ce navigateur n'est pas disponible : tes modifications ne seront pas conservées après fermeture de la page.";
}
/* Données arrivées d'une version antérieure (ou d'un import) : on leur donne un
   horodatage, sinon la fusion ne saurait pas les départager. On les date dans le
   passé pour qu'une saisie faite depuis l'emporte naturellement. */
function adoptRecords(list){
  var base = 1;
  (list||[]).forEach(function(r){ if(!r.updatedAt) r.updatedAt = base; });
  return list||[];
}
function normalizeState(){
  adoptRecords(state.accounts);
  adoptRecords(state.transactions);
  adoptRecords(state.recurring);
  if(!Array.isArray(state.charges)) state.charges = [];
  adoptRecords(state.charges);
  if(!state.budget) state.budget = {targets:{}};
  if(!state.budget.targets) state.budget.targets = {};
  if(!state.budget.ts) state.budget.ts = {};
  if(!state.tombstones) state.tombstones = {};
  ['accounts','transactions','recurring','charges'].forEach(function(k){
    if(!state.tombstones[k]) state.tombstones[k] = {};
  });
}
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      state.accounts = parsed.accounts || [];
      state.transactions = parsed.transactions || [];
      state.recurring = parsed.recurring || [];
      state.charges = parsed.charges || [];
      state.budget = parsed.budget || {targets:{}};
      state.tombstones = parsed.tombstones || null;
      state.meta = parsed.meta || {lastExportAt:null, snoozeUntil:null};
    }
    normalizeState();
    state.storageAvailable = true;
  } catch(err){
    state.storageAvailable = false;
    showStorageBanner();
    if(window.console && console.warn) console.warn('[Grand Livre] localStorage indisponible', err);
  }
  state.loaded = true;
}
function dataPayload(){
  return {
    app:'grand-livre', formatVersion:2,
    accounts:state.accounts, transactions:state.transactions, recurring:state.recurring,
    charges:state.charges, budget:state.budget, tombstones:state.tombstones
  };
}
function persist(opts){
  if(!state.storageAvailable){ showToast("Impossible d'enregistrer : le stockage de ce navigateur est indisponible.", true); return false; }
  try{
    var blob = dataPayload();
    blob.meta = state.meta;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(blob));
    renderBackupBanner();
    if(!(opts && opts.noSync)) queueSync();
    return true;
  } catch(err){
    showStorageBanner("Échec de l'enregistrement : mémoire du navigateur pleine ou indisponible.");
    showToast("Échec de l'enregistrement : "+((err&&err.message)||'mémoire du navigateur indisponible ou pleine.'), true);
    return false;
  }
}
function dataLoaded(){ return state.loaded; }

/* ---------- mutations ---------- */
function createAccount(data){
  data.id = genId();
  data.createdAt = new Date().toISOString();
  stamp(data);
  state.accounts.push(data);
  if(persist()) showToast('Compte ajouté.');
}
function updateAccount(id, data){
  var acc = state.accounts.find(function(a){return a.id===id;});
  if(!acc) return;
  Object.assign(acc, data);
  stamp(acc);
  if(persist()) showToast('Compte mis à jour.');
}
function deleteAccount(id){
  state.transactions.forEach(function(t){ if(t.accountId===id) markDeleted('transactions', t.id); });
  state.transactions = state.transactions.filter(function(t){return t.accountId!==id;});
  markDeleted('accounts', id);
  state.accounts = state.accounts.filter(function(a){return a.id!==id;});
  if(persist()) showToast('Compte supprimé.');
}
function createTransaction(data){
  data.id = genId();
  data.createdAt = new Date().toISOString();
  stamp(data);
  state.transactions.unshift(data);
  state.transactions.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
  if(persist()) showToast('Transaction ajoutée.');
}
function updateTransaction(id, data){
  var tx = state.transactions.find(function(t){return t.id===id;});
  if(!tx) return;
  Object.assign(tx, data);
  stamp(tx);
  state.transactions.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
  if(persist()) showToast('Transaction mise à jour.');
}
function deleteTransaction(id){
  markDeleted('transactions', id);
  state.transactions = state.transactions.filter(function(t){return t.id!==id;});
  if(persist()) showToast('Transaction supprimée.');
}
/* ---------- compte charges ---------- */
function createCharge(data){
  data.id = genId();
  data.createdAt = new Date().toISOString();
  stamp(data);
  state.charges.push(data);
  if(persist()) showToast('Ligne ajoutée.');
}
function updateCharge(id, data){
  var c = state.charges.find(function(x){return x.id===id;});
  if(!c) return;
  Object.assign(c, data);
  stamp(c);
  if(persist()) showToast('Ligne modifiée.');
}
function deleteCharge(id){
  markDeleted('charges', id);
  state.charges = state.charges.filter(function(c){return c.id!==id;});
  if(persist()) showToast('Ligne supprimée.');
}
function chargesTotals(){
  var debit = 0, income = 0;
  (state.charges||[]).forEach(function(c){
    if(c.type === 'income') income += c.amount; else debit += c.amount;
  });
  return {debit:debit, income:income, net:income - debit};
}

/* ---------- recurring (échéances périodiques) ---------- */
function pad2(n){ return (n<10?'0':'')+n; }
function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
function occurrenceDate(rule, year, month){
  var d = Math.min(rule.day, daysInMonth(year, month));
  return year+'-'+pad2(month)+'-'+pad2(d);
}
function ruleOccurrencesUpTo(rule, cutoffIso){
  var startIso = rule.startDate || todayStr();
  var y = parseInt(startIso.slice(0,4),10), m = parseInt(startIso.slice(5,7),10);
  var out = [], guard = 0;
  while(guard++ < 1200){
    var occ = occurrenceDate(rule, y, m);
    if(occ > cutoffIso) break;
    if(occ >= startIso) out.push(occ);
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
function nextRuleOccurrence(rule, afterIso){
  var startIso = rule.startDate || todayStr();
  var y = parseInt(startIso.slice(0,4),10), m = parseInt(startIso.slice(5,7),10);
  var guard = 0;
  while(guard++ < 1200){
    var occ = occurrenceDate(rule, y, m);
    if(occ >= startIso && occ > afterIso) return occ;
    m++; if(m>12){ m=1; y++; }
  }
  return null;
}
function upcomingOccurrences(limit){
  var today = todayStr();
  var list = (state.recurring||[]).filter(function(r){return r.active;}).map(function(r){
    return {rule:r, date: nextRuleOccurrence(r, today)};
  }).filter(function(x){return x.date;});
  list.sort(function(a,b){ return a.date<b.date?-1:1; });
  return list.slice(0, limit||5);
}
function materializeRecurring(){
  var today = todayStr();
  var created = false;
  (state.recurring||[]).forEach(function(rule){
    if(!rule.active) return;
    ruleOccurrencesUpTo(rule, today).forEach(function(occDate){
      /* Identifiant déterministe : si le Mac et l'iPhone génèrent chacun de leur
         côté l'échéance du 5 du mois, les deux portent le même identifiant et la
         fusion n'en garde qu'une, au lieu de compter le loyer deux fois. */
      var occId = 'rec_'+rule.id+'_'+occDate;
      var exists = state.transactions.some(function(t){
        return t.id===occId || (t.recurringId===rule.id && t.date===occDate);
      });
      /* Une échéance que l'utilisateur a supprimée à la main ne doit pas réapparaître. */
      if(!exists && !tombs('transactions')[occId]){
        state.transactions.push(stamp({
          id: occId, accountId: rule.accountId, type: rule.type, amount: rule.amount,
          category: rule.category, date: occDate, note: rule.note||'', recurringId: rule.id,
          createdAt: new Date().toISOString()
        }));
        created = true;
      }
    });
  });
  if(created){
    state.transactions.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
    persist();
  }
  return created;
}
function createRecurring(data){
  data.id = genId(); data.createdAt = new Date().toISOString(); data.active = true;
  stamp(data);
  state.recurring.push(data);
  if(persist()) showToast('Dépense récurrente ajoutée.');
  if(materializeRecurring()) showToast('Dépense récurrente ajoutée — la première échéance est déjà enregistrée.');
}
function updateRecurring(id, data){
  var r = state.recurring.find(function(x){return x.id===id;});
  if(!r) return;
  Object.assign(r, data);
  stamp(r);
  if(persist()) showToast('Récurrence mise à jour.');
  materializeRecurring();
}
function deleteRecurring(id){
  markDeleted('recurring', id);
  state.recurring = state.recurring.filter(function(r){return r.id!==id;});
  if(persist()) showToast('Récurrence supprimée. Les échéances déjà passées restent dans tes transactions.');
}
function toggleRecurringActive(id){
  var r = state.recurring.find(function(x){return x.id===id;});
  if(!r) return;
  r.active = !r.active;
  stamp(r);
  if(persist()) showToast(r.active ? 'Récurrence réactivée.' : 'Récurrence mise en pause.');
  if(r.active) materializeRecurring();
}

/* ---------- chart ---------- */
function trendChartSVG(){
  var months = [];
  var now = new Date();
  for(var i=5;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    var key = d.toISOString().slice(0,7);
    var isCurrent = (i===0);
    var cutoff;
    if(isCurrent){ cutoff = todayStr(); }
    else {
      var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      cutoff = key+'-'+String(lastDay).padStart(2,'0');
    }
    var label = new Intl.DateTimeFormat('fr-FR',{month:'short'}).format(d).replace('.','');
    months.push({label:label, value:computeBalanceAt(cutoff)});
  }
  var values = months.map(function(m){return m.value;});
  var min = Math.min.apply(null, values.concat([0]));
  var max = Math.max.apply(null, values);
  if(max===min) max = min+1;
  var padTop = 22, padBottom = 26, padLeft = 12, padRight = 12;
  var W = 620, H = 200;
  var innerW = W-padLeft-padRight, innerH = H-padTop-padBottom;
  var n = months.length;
  function x(i){ return padLeft + (innerW*i)/(n-1); }
  function y(v){ return padTop + innerH - ((v-min)/(max-min))*innerH; }
  var pts = months.map(function(m,i){ return [x(i), y(m.value)]; });
  var path = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
  var area = path + ' L'+pts[n-1][0].toFixed(1)+','+(padTop+innerH)+' L'+pts[0][0].toFixed(1)+','+(padTop+innerH)+' Z';
  var zeroY = (min<=0 && max>=0) ? y(0) : null;
  var labels = months.map(function(m,i){
    return '<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" font-size="10.5" text-anchor="middle" fill="var(--ink-faint)" font-family="Arial, sans-serif">'+escapeHtml(m.label)+'</text>';
  }).join('');
  var last = pts[n-1];
  /* max-width : sans elle, la courbe s'étire en hauteur sur grand écran
     et occupe la moitié de la page pour six points. */
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:visible;max-width:680px;margin:0 auto" role="img" aria-label="Évolution du solde sur 6 mois">';
  svg += '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">'+
         '<stop offset="0%" stop-color="var(--forest)" stop-opacity="0.28"/>'+
         '<stop offset="100%" stop-color="var(--forest)" stop-opacity="0.02"/></linearGradient></defs>';
  if(zeroY!==null){
    svg += '<line x1="'+padLeft+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-padRight)+'" y2="'+zeroY.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
  }
  svg += '<path d="'+area+'" fill="url(#areaGrad)" stroke="none"/>';
  svg += '<path d="'+path+'" fill="none" stroke="var(--forest)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  svg += labels;
  svg += '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.2" fill="var(--forest)"/>';
  svg += '<text x="'+last[0].toFixed(1)+'" y="'+(last[1]-11).toFixed(1)+'" font-size="11.5" text-anchor="end" fill="var(--forest)" font-weight="600" font-family="Consolas, monospace">'+escapeHtml(fmtMoney(months[n-1].value))+'</text>';
  svg += '</svg>';
  return svg;
}

/* Récapitulatif mensuel des récurrences. Les règles en pause sont exclues des
   totaux — elles ne sont pas prélevées — mais signalées, pour qu'un total qui
   « manque » quelque chose s'explique de lui-même. */
function renderRecurringSummary(){
  var wrap = document.getElementById('recurring-summary');
  if(!wrap) return;
  var rules = state.recurring || [];
  if(rules.length === 0){ wrap.innerHTML = ''; return; }

  var expense = 0, income = 0, paused = 0;
  rules.forEach(function(r){
    if(!r.active){ paused++; return; }
    if(r.type === 'income') income += r.amount; else expense += r.amount;
  });
  var net = income - expense;

  var cells = '';
  cells += '<div class="rec-figure">'+
    '<span class="hero-label">Dépenses chaque mois</span>'+
    '<span class="rec-amount mono neg">-'+fmtMoney(expense)+'</span></div>';
  if(income > 0){
    cells += '<div class="rec-figure">'+
      '<span class="hero-label">Revenus chaque mois</span>'+
      '<span class="rec-amount mono pos">+'+fmtMoney(income)+'</span></div>';
    cells += '<div class="rec-figure">'+
      '<span class="hero-label">Net</span>'+
      '<span class="rec-amount mono '+(net>=0?'pos':'neg')+'">'+(net>=0?'+':'')+fmtMoney(net)+'</span></div>';
  }

  /* Détail par compte : combien part (ou rentre) sur chacun chaque mois.
     C'est ce chiffre qui dit combien laisser sur un compte donné. */
  var perAccount = {};
  rules.forEach(function(r){
    if(!r.active) return;
    if(!perAccount[r.accountId]) perAccount[r.accountId] = 0;
    perAccount[r.accountId] += (r.type === 'income' ? r.amount : -r.amount);
  });
  var accIds = Object.keys(perAccount).sort(function(a,b){
    return Math.abs(perAccount[b]) - Math.abs(perAccount[a]);
  });
  var byAccount = '';
  if(accIds.length > 0){
    byAccount = '<div class="rec-accounts">'+accIds.map(function(id){
      var v = perAccount[id];
      return '<span class="rec-account">'+
        '<span class="dot" style="background:'+accountColor(id)+'"></span>'+
        escapeHtml(accountName(id))+
        '<span class="mono '+(v>=0?'pos':'neg')+'">'+(v>0?'+':(v<0?'-':''))+fmtMoney(Math.abs(v))+'</span>'+
      '</span>';
    }).join('')+'</div>';
  }

  wrap.innerHTML = '<div class="card rec-summary">'+cells+byAccount+
    '<p class="faint small rec-note">'+
      (paused ? paused+' récurrence'+(paused>1?'s':'')+' en pause, non comptée'+(paused>1?'s':'')+' ici.'
              : 'Montants engagés chaque mois, hors échéances déjà passées.')+
    '</p></div>';
}

function renderRecurringList(){
  var wrap = document.getElementById('recurring-list');
  if(!wrap) return;
  var rules = state.recurring||[];
  if(rules.length===0){
    wrap.innerHTML = '<div class="card card-pad empty">Aucune récurrence pour le moment — par exemple un loyer prélevé le 5, ou un abonnement mensuel.</div>';
    return;
  }
  var today = todayStr();
  var byAccount = (state.recGroupBy === 'account');

  /* Une carte par groupe plutôt qu'une longue liste d'affilée, avec le poids
     mensuel de chaque groupe en tête. Le critère de regroupement suit le
     sélecteur : par catégorie (à quoi sert l'argent) ou par compte (d'où il part). */
  var groups = {};
  rules.forEach(function(r){
    var key, label, color = null;
    if(byAccount){
      key = r.accountId || 'sans-compte';
      label = r.accountId ? accountName(r.accountId) : 'Compte supprimé';
      color = r.accountId ? accountColor(r.accountId) : null;
    } else {
      key = label = r.category || 'Sans catégorie';
    }
    if(!groups[key]) groups[key] = {name:label, color:color, rules:[], net:0};
    groups[key].rules.push(r);
    if(r.active) groups[key].net += (r.type==='income' ? r.amount : -r.amount);
  });

  /* Les catégories qui pèsent le plus arrivent en premier : c'est ce qu'on
     vient vérifier en premier sur un budget. */
  var ordered = Object.keys(groups).map(function(k){ return groups[k]; })
    .sort(function(a,b){ return Math.abs(b.net) - Math.abs(a.net); });

  wrap.innerHTML = ordered.map(function(g){
    g.rules.sort(function(a,b){ return b.amount - a.amount; });
    var head = '<div class="rec-group-head">'+
      '<span class="rec-group-name">'+
        (g.color ? '<span class="dot" style="background:'+g.color+'"></span>' : '')+
        escapeHtml(g.name)+'</span>'+
      '<span class="rec-group-total mono '+(g.net>=0?'pos':'neg')+'">'+
        (g.net>0?'+':(g.net<0?'-':''))+fmtMoney(Math.abs(g.net))+'</span>'+
    '</div>';

    var rows = g.rules.map(function(r){
      var acc = state.accounts.find(function(a){return a.id===r.accountId;});
      var next = r.active ? nextRuleOccurrence(r, today) : null;
      var key = 'rec:'+r.id;
      /* on ne répète pas dans la ligne ce qui titre déjà le groupe */
      var context = byAccount
        ? '<span class="cat-chip">'+escapeHtml(r.category)+'</span> · '
        : (acc ? escapeHtml(acc.name)+' · ' : '');
      return '<div class="budget-row" style="'+(r.active?'':'opacity:.55;')+'">'+
        '<div>'+
          '<div class="budget-cat">'+escapeHtml(r.note||r.category)+'</div>'+
          '<div class="budget-nums">'+context+'le '+r.day+' de chaque mois'+(next?(' · prochaine échéance '+fmtDate(next)):(r.active?'':' · en pause'))+'</div>'+
        '</div>'+
        '<div class="amt mono '+(r.type==='income'?'pos':'neg')+'" style="text-align:right;">'+(r.type==='income'?'+':'-')+fmtMoney(r.amount)+'</div>'+
        '<button class="icon-btn" data-act="toggle-recurring-active" data-id="'+r.id+'" title="'+(r.active?'Mettre en pause':'Réactiver')+'">'+icon(r.active?'pause':'play')+'</button>'+
        '<div style="display:flex;gap:6px;">'+
          '<button class="icon-btn" data-act="edit-recurring" data-id="'+r.id+'">'+icon('edit')+'</button>'+
          '<button class="icon-btn'+(armed.has(key)?' danger-armed':'')+'" data-act="del-recurring" data-id="'+r.id+'">'+(armed.has(key)?'Confirmer':icon('trash'))+'</button>'+
        '</div>'+
      '</div>';
    }).join('');

    return '<div class="card rec-group">'+head+rows+'</div>';
  }).join('');
}

function filteredTransactions(){
  var f = state.txFilters;
  return state.transactions.filter(function(tx){
    if(f.account!=='all' && tx.accountId!==f.account) return false;
    if(f.category!=='all' && tx.category!==f.category) return false;
    if(f.type!=='all' && tx.type!==f.type) return false;
    if(f.search){
      var s = f.search.toLowerCase();
      var hay = (tx.category+' '+(tx.note||'')+' '+accountName(tx.accountId)).toLowerCase();
      if(hay.indexOf(s)===-1) return false;

    return true;
  });

/* ---------- téléchargements ---------- */
function downloadFile(filename, text, mime){
  try{
    var blob = new Blob([text], {type: mime||'application/octet-stream'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  } catch(err){
    showToast("Échec du téléchargement : "+((err&&err.message)||'erreur inconnue'), true);
    return false;
  }
}
function exportCSV(){
  var rows = [['Date','Compte','Type','Catégorie','Montant','Note']];
  state.transactions.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(tx){
    rows.push([tx.date, accountName(tx.accountId), tx.type==='income'?'Revenu':'Dépense', tx.category, (tx.type==='income'?'':'-')+tx.amount.toFixed(2), tx.note||'']);
  });
  var csv = rows.map(function(r){
    return r.map(function(v){
      var s = String(v==null?'':v);
      return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(';');
  }).join('\r\n');
  /* BOM en tête : sans lui, Excel affiche « DÃ©penses » au lieu de « Dépenses » */
  if(downloadFile('grand-livre-transactions.csv', '﻿'+csv, 'text/csv;charset=utf-8')){
    showToast('Export CSV téléchargé.');
  }
}

/* ================= SYNCHRONISATION ENTRE APPAREILS =================
   Les données vivent dans un fichier JSON d'un dépôt GitHub privé. Chaque
   appareil garde sa copie locale et fusionne ligne à ligne : personne n'écrase
   le travail de l'autre, même après une saisie hors ligne des deux côtés. */

function indexById(list){
  var m = {};
  (list||[]).forEach(function(r){ if(r && r.id) m[r.id] = r; });
  return m;
}

/* Fusion d'une collection. Pour chaque identifiant, on compare la date du
   dernier événement de chaque côté — modification ou suppression — et le plus
   récent l'emporte. Une suppression récente bat donc une vieille modification,
   et inversement. */
function mergeCollection(localList, localTombs, remoteList, remoteTombs){
  var L = indexById(localList), R = indexById(remoteList);
  var lt = localTombs || {}, rt = remoteTombs || {};
  var ids = {};
  [Object.keys(L), Object.keys(R), Object.keys(lt), Object.keys(rt)].forEach(function(keys){
    keys.forEach(function(id){ ids[id] = 1; });
  });

  var records = [], tombstones = {};
  Object.keys(ids).forEach(function(id){
    var lRec = L[id], rRec = R[id];
    var lDel = lt[id] || 0, rDel = rt[id] || 0;
    var lTime = Math.max(lRec ? (lRec.updatedAt||0) : 0, lDel);
    var rTime = Math.max(rRec ? (rRec.updatedAt||0) : 0, rDel);
    var useLocal = lTime >= rTime;
    var rec = useLocal ? lRec : rRec;
    var del = useLocal ? lDel : rDel;
    var recTime = rec ? (rec.updatedAt||0) : -1;
    if(del && del >= recTime) tombstones[id] = Math.max(lDel, rDel);
    else if(rec) records.push(rec);
  });
  return {records:records, tombstones:tombstones};
}

/* Les objectifs de budget se fusionnent catégorie par catégorie. */
function mergeBudget(localB, remoteB){
  var lTar = (localB && localB.targets) || {}, rTar = (remoteB && remoteB.targets) || {};
  var lts = (localB && localB.ts) || {}, rts = (remoteB && remoteB.ts) || {};
  var cats = {};
  [lTar, rTar, lts, rts].forEach(function(m){ Object.keys(m).forEach(function(c){ cats[c] = 1; }); });
  var targets = {}, ts = {};
  Object.keys(cats).forEach(function(c){
    var lTime = lts[c] || 0, rTime = rts[c] || 0;
    var src = (lTime >= rTime) ? lTar : rTar;
    if(lTime || rTime) ts[c] = Math.max(lTime, rTime);
    if(src[c] > 0) targets[c] = src[c];
  });
  return {targets:targets, ts:ts};
}

function mergeRemoteIntoState(remote){
  remote = remote || {};
  var rTomb = remote.tombstones || {};
  var a = mergeCollection(state.accounts, tombs('accounts'), remote.accounts, rTomb.accounts);
  var t = mergeCollection(state.transactions, tombs('transactions'), remote.transactions, rTomb.transactions);
  var r = mergeCollection(state.recurring, tombs('recurring'), remote.recurring, rTomb.recurring);
  var ch = mergeCollection(state.charges, tombs('charges'), remote.charges, rTomb.charges);
  state.accounts = a.records;
  state.transactions = t.records.sort(function(x,y){ return x.date<y.date?1:(x.date>y.date?-1:0); });
  state.recurring = r.records;
  state.charges = ch.records;
  state.tombstones = {accounts:a.tombstones, transactions:t.tombstones, recurring:r.tombstones, charges:ch.tombstones};
  state.budget = mergeBudget(state.budget, remote.budget);
}

/* Empreinte stable d'un jeu de données : sert à savoir si la fusion a changé
   quelque chose par rapport au fichier distant, donc s'il faut le réécrire. */
function signature(payload){
  function collSig(list, tomb){
    var a = (list||[]).map(function(r){ return r.id+':'+(r.updatedAt||0); }).sort().join(',');
    var b = Object.keys(tomb||{}).sort().map(function(k){ return k+'!'+tomb[k]; }).join(',');
    return a+'|'+b;
  }
  var tb = payload.tombstones || {};
  var bud = payload.budget || {};
  var bts = Object.keys(bud.ts||{}).sort().map(function(k){ return k+':'+bud.ts[k]; }).join(',');
  var btar = Object.keys(bud.targets||{}).sort().map(function(k){ return k+'='+bud.targets[k]; }).join(',');
  return [
    collSig(payload.accounts, tb.accounts),
    collSig(payload.transactions, tb.transactions),
    collSig(payload.recurring, tb.recurring),
    collSig(payload.charges, tb.charges),
    bts, btar
  ].join('||');
}

/* ---------- réglages de synchro (stockés à part des données) ---------- */
function loadSyncSettings(){
  try{
    var raw = localStorage.getItem(SYNC_KEY);
    if(raw){
      var s = JSON.parse(raw);
      sync.token = s.token || '';
      sync.owner = s.owner || '';
      sync.repo = s.repo || '';
      sync.path = s.path || 'grand-livre.json';
      sync.branch = s.branch || 'main';
      sync.sha = s.sha || null;
      sync.lastSyncAt = s.lastSyncAt || null;
      sync.dirty = !!s.dirty;
    }
  }catch(err){ /* stockage indisponible : on reste en mode local */ }
  sync.status = syncConfigured() ? 'idle' : 'off';
}
function saveSyncSettings(){
  try{
    localStorage.setItem(SYNC_KEY, JSON.stringify({
      token:sync.token, owner:sync.owner, repo:sync.repo, path:sync.path,
      branch:sync.branch, sha:sync.sha, lastSyncAt:sync.lastSyncAt, dirty:sync.dirty
    }));
  }catch(err){ /* rien à faire : la synchro repartira au prochain chargement */ }
}
function syncConfigured(){ return !!(sync.token && sync.owner && sync.repo && sync.path); }
