<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Livre</title>
<meta name="theme-color" content="#7C6B93">
<meta name="apple-mobile-web-app-title" content="Grand Livre">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Nunito:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: light dark;
    /* Lavande & miel — greige chaud, prune grisé, accents doux */
    --bg:#F4F1F0; --bg-raised:#FFFCFB; --bg-sunken:#EAE4E8; --line:#E2DAE0;
    --ink:#3E3644; --ink-soft:#6E6478; --ink-faint:#9A90A2;
    --lavender:#7C6B93; --lavender-soft:#EDE7F2;
    --honey:#A87A22; --honey-soft:#F7EBD4;
    --rose:#A8574F; --rose-soft:#F6E0DD;
    --shadow:0 2px 4px rgba(62,54,68,.04), 0 14px 30px -20px rgba(62,54,68,.30);
    --radius:22px;
    --radius-sm:14px;
    --radius-pill:999px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C1820; --bg-raised:#262130; --bg-sunken:#151119; --line:#372F42;
      --ink:#EDE7F0; --ink-soft:#B6ABBF; --ink-faint:#847A8D;
      --lavender:#BCA9D0; --lavender-soft:#332A3D;
      --honey:#E0B35F; --honey-soft:#3A2F1C;
      --rose:#D8938C; --rose-soft:#3A2622;
      --shadow:0 2px 4px rgba(0,0,0,.30), 0 16px 34px -20px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1820; --bg-raised:#262130; --bg-sunken:#151119; --line:#372F42;
    --ink:#EDE7F0; --ink-soft:#B6ABBF; --ink-faint:#847A8D;
    --lavender:#BCA9D0; --lavender-soft:#332A3D;
    --honey:#E0B35F; --honey-soft:#3A2F1C;
    --rose:#D8938C; --rose-soft:#3A2622;
    --shadow:0 2px 4px rgba(0,0,0,.30), 0 16px 34px -20px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Literata',Georgia,serif; font-weight:600; text-wrap:balance; margin:0;}
  .mono{font-family:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink-soft);}
  .faint{color:var(--ink-faint);}
  .small{font-size:12.5px;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}

  .app{display:grid; grid-template-columns:232px 1fr; min-height:100vh;}
  .sidebar{
    background:var(--bg-raised); border-right:1px solid var(--line);
    padding:22px 16px; display:flex; flex-direction:column; gap:22px;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 4px;}
  .brand-mark{font-size:22px;}
  .brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:19px; letter-spacing:.2px;}
  .nav-list{display:flex; flex-direction:column; gap:3px;}
  .nav-btn{
    display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:var(--radius-pill);
    border:none; background:transparent; color:var(--ink-soft); font-size:14px; font-weight:500;
    text-align:left; width:100%;
  }
  .nav-btn svg{width:18px; height:18px; flex:none;}
  .nav-btn:hover{background:var(--bg-sunken); color:var(--ink);}
  .nav-btn.active{background:var(--lavender-soft); color:var(--lavender); font-weight:600;}
  .sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px; padding:0 4px;}

  .main{display:flex; flex-direction:column; min-width:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:22px 32px; border-bottom:1px solid var(--line);
  }
  .content{padding:28px 32px 56px; max-width:1080px; width:100%;}

  .banner{
    margin:0 32px 0; margin-top:16px; padding:13px 18px; border-radius:var(--radius-sm);
    background:var(--honey-soft); color:var(--honey); font-size:13.5px; display:flex; gap:10px; align-items:center;
  }

  .sync-chip{
    display:flex; align-items:center; gap:8px; padding:10px 13px; border-radius:var(--radius-pill);
    background:var(--bg-sunken); font-size:12.5px; color:var(--ink-soft); cursor:pointer; line-height:1.35;
  }
  .sync-chip:hover{color:var(--ink);}
  .sync-chip .sync-dot{width:8px; height:8px; border-radius:50%; flex:none; background:var(--ink-faint);}
  .sync-chip.is-idle .sync-dot{background:var(--lavender);}
  .sync-chip.is-syncing .sync-dot{background:var(--honey); animation:pulse 1.1s ease-in-out infinite;}
  .sync-chip.is-error .sync-dot{background:var(--rose);}
  .sync-chip.is-offline .sync-dot{background:var(--honey);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  @media (prefers-reduced-motion: reduce){ .sync-chip.is-syncing .sync-dot{animation:none;} }

  .settings-section{margin-bottom:16px;}
  .settings-section h3{font-size:15px; margin-bottom:4px;}
  .settings-section p.lead{margin:0 0 14px; font-size:13px; color:var(--ink-soft);}
  .sync-state{
    display:flex; gap:10px; align-items:flex-start; padding:13px 16px; border-radius:var(--radius-sm);
    background:var(--bg-sunken); font-size:13px; margin-bottom:16px;
  }
  .sync-state svg{width:17px; height:17px; flex:none; margin-top:1px;}
  .sync-state.ok{color:var(--lavender);} .sync-state.warn{color:var(--honey);} .sync-state.bad{color:var(--rose);}
  .sync-state .sync-state-sub{display:block; color:var(--ink-faint); font-size:12.5px; margin-top:3px;}

  .backup-banner{
    margin:16px 32px 0; padding:15px 18px; border-radius:var(--radius-sm);
    background:var(--bg-raised); border:1px solid var(--line); border-left:3px solid var(--honey);
    box-shadow:var(--shadow); display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  .backup-banner .backup-text{flex:1; min-width:210px;}
  .backup-banner .backup-text strong{display:block; font-size:13.5px; color:var(--ink); font-weight:600;}
  .backup-banner .backup-text span{font-size:12.5px; color:var(--ink-faint);}
  .backup-banner .backup-actions{display:flex; gap:8px; flex:none;}

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:50;
    padding:11px 20px; border-radius:var(--radius-pill); font-size:13.5px; font-weight:600;
    background:var(--lavender); color:#F5F8F4; box-shadow:var(--shadow); max-width:min(90vw,420px); text-align:center;
  }
  .toast.toast-error{background:var(--rose);}

  .offline-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    text-transform:uppercase; letter-spacing:.05em; color:var(--honey); background:var(--honey-soft);
    padding:4px 11px; border-radius:var(--radius-pill);
  }
  .offline-badge::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--honey);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,14,12,.5); z-index:60;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-card{max-width:420px; width:100%; padding:24px 26px;}
  .modal-card h3{font-size:16px;}

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border-radius:var(--radius-pill);
    border:1px solid transparent; font-size:13.5px; font-weight:600; white-space:nowrap;
  }
  .btn svg{width:16px; height:16px;}
  .btn-primary{background:var(--lavender); color:#F5F8F4;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{background:var(--bg-sunken);}
  .btn-subtle{background:var(--bg-sunken); color:var(--ink-soft);}
  .btn-block{width:100%; justify-content:center;}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
    border-radius:50%; border:1px solid var(--line); background:var(--bg-raised); color:var(--ink-soft);
  }
  .icon-btn svg{width:15px; height:15px;}
  .icon-btn:hover{background:var(--bg-sunken); color:var(--ink);}
  .icon-btn.danger-armed{background:var(--rose); border-color:var(--rose); color:#fff; font-size:11px; font-weight:700; width:auto; padding:0 10px;}

  .page-head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px;}
  .page-head p{margin:2px 0 0;}

  .card{background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .card-pad{padding:20px 22px;}

  /* Dashboard */
  .hero{padding:26px 26px 22px; margin-bottom:16px;}
  .hero-label{text-transform:uppercase; letter-spacing:.09em; font-size:11.5px; font-weight:600; color:var(--ink-faint);}
  .hero-value{font-family:'IBM Plex Mono',monospace; font-size:44px; font-weight:500; margin-top:6px; letter-spacing:-.01em;}
  .hero-accounts{display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}
  .acc-pill{display:flex; align-items:center; gap:7px; font-size:13px;}
  .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .acc-pill .mono{font-weight:500;}

  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px;}
  .stat-tile{padding:16px 18px;}
  .stat-tile .hero-label{font-size:11px;}
  .stat-tile .stat-value{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:500; margin-top:6px;}
  .stat-tile.income .stat-value{color:var(--lavender);}
  .stat-tile.expense .stat-value{color:var(--rose);}

  .chart-card{padding:20px 22px 14px; margin-bottom:16px;}
  .chart-card h3{font-size:15px; margin-bottom:12px;}

  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;}
  .panel{padding:18px 20px;}
  .panel h3{font-size:14.5px; margin-bottom:12px;}
  .bar-row{display:grid; grid-template-columns:88px 1fr auto; gap:10px; align-items:center; margin-bottom:9px; font-size:12.5px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-track{height:8px; background:var(--bg-sunken); border-radius:var(--radius-pill); overflow:hidden;}
  .bar-fill{height:100%; border-radius:var(--radius-pill);}
  .bar-row .amt{text-align:right; white-space:nowrap;}

  .empty{padding:26px 10px; text-align:center; color:var(--ink-faint); font-size:13.5px;}
  .empty svg{width:26px; height:26px; margin-bottom:8px; opacity:.6;}

  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--ink-faint); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:11px 10px; border-bottom:1px solid var(--line);}
  tbody tr:last-child td{border-bottom:none;}
  td.amt{text-align:right; font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  td.amt.pos{color:var(--lavender);}
  td.amt.neg{color:var(--rose);}
  td.actions{text-align:right; white-space:nowrap;}
  td.actions .icon-btn{margin-left:6px;}
  .cat-chip{display:inline-block; padding:3px 11px; border-radius:var(--radius-pill); background:var(--bg-sunken); font-size:12px; color:var(--ink-soft);}
  .rec-badge svg{width:12px; height:12px; vertical-align:-1px; opacity:.55; margin-right:3px;}
  .table-wrap{overflow-x:auto;}

  /* Forms */
  .form-card{padding:20px 22px; margin-bottom:18px;}
  .form-card h3{font-size:15px; margin-bottom:14px;}
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:12px; font-weight:600; color:var(--ink-soft);}
  .field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea{
    padding:11px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg);
    color:var(--ink); font-size:13.5px; width:100%;
  }
  .field input:focus, .field select:focus, .type-opt input:focus + span{outline:2px solid var(--lavender); outline-offset:1px;}
  .form-actions{display:flex; gap:10px; margin-top:4px;}
  .type-toggle{display:flex; gap:8px;}
  .type-opt{position:relative;}
  .type-opt input{position:absolute; opacity:0; inset:0; cursor:pointer;}
  .type-opt span{
    display:block; padding:10px 18px; border-radius:var(--radius-pill); border:1px solid var(--line); font-size:13px; font-weight:600;
    color:var(--ink-soft); background:var(--bg);
  }
  .type-opt input:checked + span.expense{background:var(--rose-soft); border-color:var(--rose); color:var(--rose);}
  .type-opt input:checked + span.income{background:var(--lavender-soft); border-color:var(--lavender); color:var(--lavender);}
  .swatches{display:flex; gap:8px;}
  .swatch{width:26px; height:26px; border-radius:50%; border:2px solid transparent; position:relative;}
  .swatch input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .swatch.selected{border-color:var(--ink);}

  /* Accounts */
  .accounts-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .account-card{padding:20px 20px 18px; position:relative; border-top:4px solid var(--lavender);}
  .account-card .acc-type{font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em;}
  .account-card .acc-name{font-size:16px; font-weight:600; margin:3px 0 10px; font-family:'Fraunces',serif;}
  .account-card .acc-balance{font-family:'IBM Plex Mono',monospace; font-size:23px;}
  .account-card .acc-meta{margin-top:10px; font-size:12px; color:var(--ink-faint);}
  .account-card .acc-actions{position:absolute; top:14px; right:14px; display:flex; gap:6px;}

  /* Filters */
  .filters{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; align-items:center;}
  .filters select, .filters input[type=text]{
    padding:9px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg-raised);
    color:var(--ink); font-size:13px;
  }
  .filters input[type=text]{min-width:170px;}

  /* Budget */
  .budget-row{display:grid; grid-template-columns:150px 1fr 130px 140px; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
  .budget-row:last-child{border-bottom:none;}
  .budget-cat{font-weight:600; font-size:13.5px;}
  .budget-track{height:9px; background:var(--bg-sunken); border-radius:var(--radius-pill); overflow:hidden;}
  .budget-fill{height:100%; border-radius:var(--radius-pill);}
  .budget-nums{font-size:12px; color:var(--ink-faint); margin-top:5px;}
  .budget-input-wrap{display:flex; align-items:center; gap:6px;}
  .budget-input-wrap input{
    width:100%; padding:8px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg);
    font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:right;
  }
  .status-tag{font-size:11px; font-weight:700; padding:3px 10px; border-radius:var(--radius-pill); text-align:center; width:fit-content;}
  .status-ok{background:var(--lavender-soft); color:var(--lavender);}
  .status-warn{background:var(--honey-soft); color:var(--honey);}
  .status-over{background:var(--rose-soft); color:var(--rose);}

  .topnav{display:none;}

  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .topnav{
      display:flex; gap:4px; overflow-x:auto; padding:12px 16px; background:var(--bg-raised);
      border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;
    }
    .topnav .nav-btn{width:auto; flex:none;}
    .topbar{padding:16px 18px; flex-wrap:wrap; row-gap:12px;}
    .topbar h1{font-size:23px;}
    .topbar > div{flex:1 1 auto;}
    .banner{margin-left:18px; margin-right:18px;}
    .backup-banner{margin:14px 18px 0;}
    .backup-banner .backup-actions{width:100%;}
    .backup-banner .backup-actions .btn{flex:1; justify-content:center;}
    .content{padding:18px 18px 48px;}
    .field-grid{grid-template-columns:1fr;}
    .stat-row{grid-template-columns:1fr;}
    .dash-grid{grid-template-columns:1fr;}
    .budget-row{grid-template-columns:1fr; gap:6px;}
    .hero-value{font-size:34px;}
  }
</style>
</head>
<body>

<div class="app" id="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">📒</span><span class="brand-name">Grand Livre</span></div>
    <div class="nav-list" id="nav-list-desktop"></div>
    <div class="sidebar-foot">
      <div class="sync-chip" id="sync-chip" data-act="nav" data-page="settings"></div>
    </div>
  </nav>
  <main class="main">
    <div class="topnav" id="nav-list-mobile"></div>
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <h1 id="page-title">Vue d'ensemble</h1>
        <span id="offline-badge" class="offline-badge" hidden>Hors ligne</span>
      </div>
      <button class="btn btn-primary" data-act="quick-add"></button>
    </header>
    <div class="banner" id="db-banner" hidden></div>
    <div class="backup-banner" id="backup-banner" hidden>
      <div class="backup-text">
        <strong id="backup-title">Pense à sauvegarder tes données</strong>
        <span id="backup-sub"></span>
      </div>
      <div class="backup-actions">
        <button class="btn btn-primary btn-sm" data-act="backup-now">Sauvegarder</button>
        <button class="btn btn-ghost btn-sm" data-act="backup-later">Plus tard</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-overlay" id="import-confirm" hidden>
  <div class="card modal-card">
    <h3>Importer ces données ?</h3>
    <p class="muted" id="import-summary" style="margin:8px 0;"></p>
    <p class="faint small">Cela remplace toutes les données actuellement enregistrées sur cet appareil. Cette action ne peut pas être annulée.</p>
    <div class="form-actions">
      <button class="btn btn-primary" data-act="confirm-import">Remplacer mes données</button>
      <button class="btn btn-ghost" data-act="cancel-import">Annuler</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
var EXPENSE_CATS = ['Logement','Alimentation','Transport','Santé','Loisirs','Shopping','Abonnements','Assurance','Éducation','Autres dépenses'];
var INCOME_CATS = ['Salaire','Freelance','Remboursement','Cadeau','Autres revenus'];
var ACCOUNT_TYPES = ['Compte courant','Livret / Épargne','Espèces','Autre'];
/* Couleurs de compte : tons doux, assez distincts pour se reconnaître d'un
   coup d'œil, assez sourds pour rester lisibles sur fond clair comme sombre. */
var PALETTE = ['#8E7BA6','#C9963E','#6E8CA8','#BE7C86','#7D9A77','#C08268'];
var NAV = [
  {id:'dashboard', label:'Vue d’ensemble', icon:'grid'},
  {id:'transactions', label:'Transactions', icon:'swap'},
  {id:'recurring', label:'Récurrent', icon:'repeat'},
  {id:'accounts', label:'Comptes', icon:'wallet'},
  {id:'budget', label:'Budget', icon:'target'},
  {id:'settings', label:'Réglages', icon:'gear'}
];

/* ---------- icons ---------- */
function icon(name){
  var p = {
    grid:'<rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>',
    swap:'<path d="M4 8h13l-3.2-3.2"/><path d="M20 16H7l3.2 3.2"/>',
    wallet:'<rect x="3" y="6.5" width="18" height="12" rx="2.2"/><path d="M3 10.5h18"/><circle cx="16.8" cy="14.5" r="1.1" fill="currentColor" stroke="none"/>',
    target:'<circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="4.3"/><circle cx="12" cy="12" r=".9" fill="currentColor" stroke="none"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    edit:'<path d="M4 20l.9-4 11-11a1.6 1.6 0 0 1 2.3 0l.8.8a1.6 1.6 0 0 1 0 2.3L8 19l-4 1Z"/>',

/* ---------- state ---------- */
var STORAGE_KEY = 'grand-livre-data-v1';
var SYNC_KEY = 'grand-livre-sync-v1';
var state = {
  page:'dashboard',
  accounts:[],
  transactions:[],
  recurring:[],
  budget:{targets:{}, updatedAt:0},
  /* Ce qui a été supprimé, et quand. Sans cette trace, une suppression faite
     sur un appareil serait ressuscitée par l'autre à la fusion suivante. */
  tombstones:{accounts:{}, transactions:{}, recurring:{}},
  meta:{lastExportAt:null, snoozeUntil:null},
  loaded:false,
  storageAvailable:true,
  showAccountForm:false, editAccountId:null,
  showTxForm:false, editTxId:null,
  showRecurringForm:false, editRecurringId:null,
  txFilters:{account:'all', category:'all', type:'all', search:''}
};
var armed = new Set();

/* Réglages de synchronisation. Le jeton reste sur cet appareil : il n'est
   envoyé qu'à api.github.com, jamais ailleurs. */
var sync = {
  token:'', owner:'', repo:'', path:'grand-livre.json', branch:'main',
  sha:null,            /* version du fichier distant vue en dernier */
  lastSyncAt:null,
  status:'off',        /* off | idle | syncing | error | offline */
  message:'',
  dirty:false,         /* des changements locaux attendent d'être envoyés */
  pulling:false
};
var syncTimer = null;

function now(){ return Date.now(); }
function stamp(rec){ rec.updatedAt = now(); return rec; }
function tombs(kind){
  if(!state.tombstones) state.tombstones = {accounts:{}, transactions:{}, recurring:{}};
  if(!state.tombstones[kind]) state.tombstones[kind] = {};
  return state.tombstones[kind];
}
function markDeleted(kind, id){ tombs(kind)[id] = now(); }

/* ---------- utils ---------- */
function fmtMoney(n){
  return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n||0);
}
function fmtDate(iso){
  var d = new Date(iso+'T00:00:00');
  return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'short',year:'numeric'}).format(d);
}
function todayStr(){
  var d = new Date(); var tz = d.getTimezoneOffset();
  return new Date(d.getTime()-tz*60000).toISOString().slice(0,10);
}
function monthKeyOf(iso){ return iso.slice(0,7); }
function currentMonthKey(){ return todayStr().slice(0,7); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uniq(arr){ return arr.filter(function(v,i){ return arr.indexOf(v)===i; }); }

function signedAmount(tx){ return tx.type==='income' ? tx.amount : -tx.amount; }

function accountBalance(acc){
  var sum = acc.initialBalance||0;
  var today = todayStr();
  state.transactions.forEach(function(tx){ if(tx.accountId===acc.id && tx.date<=today) sum += signedAmount(tx); });
  return sum;
}
function totalBalance(){
  var sum = 0;
  var today = todayStr();
  state.accounts.forEach(function(a){ sum += (a.initialBalance||0); });
  state.transactions.forEach(function(tx){ if(tx.date<=today) sum += signedAmount(tx); });
  return sum;
}
function computeBalanceAt(cutoffIso){
  var sum = 0;
  state.accounts.forEach(function(a){ sum += (a.initialBalance||0); });
  state.transactions.forEach(function(tx){ if(tx.date<=cutoffIso) sum += signedAmount(tx); });
  return sum;
}
function monthTx(monthKey, type){
  return state.transactions.filter(function(tx){ return monthKeyOf(tx.date)===monthKey && (!type || tx.type===type); });
}
function monthSum(monthKey, type){
  return monthTx(monthKey, type).reduce(function(s,tx){ return s+tx.amount; },0);
}
function categorySpend(monthKey){
  var map = {};
  monthTx(monthKey,'expense').forEach(function(tx){ map[tx.category] = (map[tx.category]||0)+tx.amount; });
  return map;
}
function allExpenseCategories(){
  var used = state.transactions.filter(function(t){return t.type==='expense';}).map(function(t){return t.category;});
  var rec = state.recurring.filter(function(r){return r.type==='expense';}).map(function(r){return r.category;});
  var targeted = Object.keys(state.budget.targets||{});
  return uniq(EXPENSE_CATS.concat(used).concat(rec).concat(targeted));
}
function allIncomeCategories(){
  var used = state.transactions.filter(function(t){return t.type==='income';}).map(function(t){return t.category;});
  var rec = state.recurring.filter(function(r){return r.type==='income';}).map(function(r){return r.category;});
  return uniq(INCOME_CATS.concat(used).concat(rec));
}
function accountName(id){ var a = state.accounts.find(function(x){return x.id===id;}); return a? a.name : '—'; }
function accountColor(id){ var a = state.accounts.find(function(x){return x.id===id;}); return a? a.color : '#999'; }

function showToast(msg, isError){
  var t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; t.hidden = true; document.body.appendChild(t); }
  t.textContent = msg;
  t.className = 'toast' + (isError?' toast-error':'');
  t.hidden = false;
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.hidden = true; }, isError ? 7000 : 3200);
}
function genId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

/* ---------- local storage persistence ---------- */
function showStorageBanner(msg){
  var b = document.getElementById('db-banner');
  if(!b) return;
  b.hidden = false;
  b.textContent = msg || "Le stockage de ce navigateur n'est pas disponible : tes modifications ne seront pas conservées après fermeture de la page.";
}
/* Données arrivées d'une version antérieure (ou d'un import) : on leur donne un
   horodatage, sinon la fusion ne saurait pas les départager. On les date dans le
   passé pour qu'une saisie faite depuis l'emporte naturellement. */
function adoptRecords(list){
  var base = 1;
  (list||[]).forEach(function(r){ if(!r.updatedAt) r.updatedAt = base; });
  return list||[];
}
function normalizeState(){
  adoptRecords(state.accounts);
  adoptRecords(state.transactions);
  adoptRecords(state.recurring);
  if(!state.budget) state.budget = {targets:{}};
  if(!state.budget.targets) state.budget.targets = {};
  if(!state.budget.ts) state.budget.ts = {};
  if(!state.tombstones) state.tombstones = {};
  ['accounts','transactions','recurring'].forEach(function(k){
    if(!state.tombstones[k]) state.tombstones[k] = {};
  });
}
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      state.accounts = parsed.accounts || [];
      state.transactions = parsed.transactions || [];
      state.recurring = parsed.recurring || [];
      state.budget = parsed.budget || {targets:{}};
      state.tombstones = parsed.tombstones || null;
      state.meta = parsed.meta || {lastExportAt:null, snoozeUntil:null};
    }
    normalizeState();
    state.storageAvailable = true;
  } catch(err){
    state.storageAvailable = false;
    showStorageBanner();
    if(window.console && console.warn) console.warn('[Grand Livre] localStorage indisponible', err);
  }
  state.loaded = true;
}
function dataPayload(){
  return {
    app:'grand-livre', formatVersion:2,
    accounts:state.accounts, transactions:state.transactions, recurring:state.recurring,
    budget:state.budget, tombstones:state.tombstones
  };
}
function persist(opts){
  if(!state.storageAvailable){ showToast("Impossible d'enregistrer : le stockage de ce navigateur est indisponible.", true); return false; }
  try{
    var blob = dataPayload();
    blob.meta = state.meta;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(blob));
    renderBackupBanner();
    if(!(opts && opts.noSync)) queueSync();
    return true;
  } catch(err){
    showStorageBanner("Échec de l'enregistrement : mémoire du navigateur pleine ou indisponible.");
    showToast("Échec de l'enregistrement : "+((err&&err.message)||'mémoire du navigateur indisponible ou pleine.'), true);
    return false;
  }
}
function dataLoaded(){ return state.loaded; }

/* ---------- mutations ---------- */
function createAccount(data){
  data.id = genId();
  data.createdAt = new Date().toISOString();
  stamp(data);
  state.accounts.push(data);
  if(persist()) showToast('Compte ajouté.');
}
function updateAccount(id, data){
  var acc = state.accounts.find(function(a){return a.id===id;});
  if(!acc) return;
  Object.assign(acc, data);
  stamp(acc);
  if(persist()) showToast('Compte mis à jour.');
}
function deleteAccount(id){
  state.transactions.forEach(function(t){ if(t.accountId===id) markDeleted('transactions', t.id); });
  state.transactions = state.transactions.filter(function(t){return t.accountId!==id;});
  markDeleted('accounts', id);
  state.accounts = state.accounts.filter(function(a){return a.id!==id;});
  if(persist()) showToast('Compte supprimé.');
}
function createTransaction(data){
  data.id = genId();
  data.createdAt = new Date().toISOString();
  stamp(data);
  state.transactions.unshift(data);
  state.transactions.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
  if(persist()) showToast('Transaction ajoutée.');
}
function updateTransaction(id, data){
  var tx = state.transactions.find(function(t){return t.id===id;});
  if(!tx) return;
  Object.assign(tx, data);
  stamp(tx);
  state.transactions.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
  if(persist()) showToast('Transaction mise à jour.');
}
function deleteTransaction(id){
  markDeleted('transactions', id);
  state.transactions = state.transactions.filter(function(t){return t.id!==id;});
  if(persist()) showToast('Transaction supprimée.');
}
function saveBudgetTarget(cat, amount){
  var targets = Object.assign({}, state.budget.targets||{});
  if(amount>0) targets[cat] = amount; else delete targets[cat];
  state.budget.targets = targets;
  /* Horodatage par catégorie : un objectif posé sur le Mac et un autre sur
     l'iPhone se retrouvent tous les deux après fusion, au lieu que le dernier
     enregistrement écrase l'autre en bloc. */
  if(!state.budget.ts) state.budget.ts = {};
  state.budget.ts[cat] = now();
  if(persist()) showToast('Objectif enregistré.');
}

/* ---------- recurring (échéances périodiques) ---------- */
function pad2(n){ return (n<10?'0':'')+n; }
function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
function occurrenceDate(rule, year, month){
  var d = Math.min(rule.day, daysInMonth(year, month));
  return year+'-'+pad2(month)+'-'+pad2(d);
}
function ruleOccurrencesUpTo(rule, cutoffIso){
  var startIso = rule.startDate || todayStr();
  var y = parseInt(startIso.slice(0,4),10), m = parseInt(startIso.slice(5,7),10);
  var out = [], guard = 0;
  while(guard++ < 1200){
    var occ = occurrenceDate(rule, y, m);
    if(occ > cutoffIso) break;
    if(occ >= startIso) out.push(occ);
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
function nextRuleOccurrence(rule, afterIso){
  var startIso = rule.startDate || todayStr();
  var y = parseInt(startIso.slice(0,4),10), m = parseInt(startIso.slice(5,7),10);
  var guard = 0;
  while(guard++ < 1200){
    var occ = occurrenceDate(rule, y, m);
    if(occ >= startIso && occ > afterIso) return occ;
    m++; if(m>12){ m=1; y++; }
  }
  return null;
}
function upcomingOccurrences(limit){
  var today = todayStr();
  var list = (state.recurring||[]).filter(function(r){return r.active;}).map(function(r){
    return {rule:r, date: nextRuleOccurrence(r, today)};
  }).filter(function(x){return x.date;});
  list.sort(function(a,b){ return a.date<b.date?-1:1; });
  return list.slice(0, limit||5);
}
function materializeRecurring(){
  var today = todayStr();
  var created = false;
  (state.recurring||[]).forEach(function(rule){
    if(!rule.active) return;
    ruleOccurrencesUpTo(rule, today).forEach(function(occDate){
      /* Identifiant déterministe : si le Mac et l'iPhone génèrent chacun de leur
         côté l'échéance du 5 du mois, les deux portent le même identifiant et la
         fusion n'en garde qu'une, au lieu de compter le loyer deux fois. */
      var occId = 'rec_'+rule.id+'_'+occDate;
      var exists = state.transactions.some(function(t){
        return t.id===occId || (t.recurringId===rule.id && t.date===occDate);
      });
      /* Une échéance que l'utilisateur a supprimée à la main ne doit pas réapparaître. */
      if(!exists && !tombs('transactions')[occId]){
        state.transactions.push(stamp({
          id: occId, accountId: rule.accountId, type: rule.type, amount: rule.amount,
          category: rule.category, date: occDate, note: rule.note||'', recurringId: rule.id,
          createdAt: new Date().toISOString()
        }));
        created = true;
      }
    });
  });
  if(created){
    state.transactions.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
    persist();
  }
  return created;
}
function createRecurring(data){
  data.id = genId(); data.createdAt = new Date().toISOString(); data.active = true;
  stamp(data);
  state.recurring.push(data);
  if(persist()) showToast('Dépense récurrente ajoutée.');
  if(materializeRecurring()) showToast('Dépense récurrente ajoutée — la première échéance est déjà enregistrée.');
}
function updateRecurring(id, data){
  var r = state.recurring.find(function(x){return x.id===id;});
  if(!r) return;
  Object.assign(r, data);
  stamp(r);
  if(persist()) showToast('Récurrence mise à jour.');
  materializeRecurring();
}
function deleteRecurring(id){
  markDeleted('recurring', id);
  state.recurring = state.recurring.filter(function(r){return r.id!==id;});
  if(persist()) showToast('Récurrence supprimée. Les échéances déjà passées restent dans tes transactions.');
}
function toggleRecurringActive(id){
  var r = state.recurring.find(function(x){return x.id===id;});
  if(!r) return;
  r.active = !r.active;
  stamp(r);
  if(persist()) showToast(r.active ? 'Récurrence réactivée.' : 'Récurrence mise en pause.');
  if(r.active) materializeRecurring();
}

/* ---------- chart ---------- */
function trendChartSVG(){
  var months = [];
  var now = new Date();
  for(var i=5;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    var key = d.toISOString().slice(0,7);
    var isCurrent = (i===0);
    var cutoff;
    if(isCurrent){ cutoff = todayStr(); }
    else {
      var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      cutoff = key+'-'+String(lastDay).padStart(2,'0');
    }
    var label = new Intl.DateTimeFormat('fr-FR',{month:'short'}).format(d).replace('.','');
    months.push({label:label, value:computeBalanceAt(cutoff)});
  }
  var values = months.map(function(m){return m.value;});
  var min = Math.min.apply(null, values.concat([0]));
  var max = Math.max.apply(null, values);
  if(max===min) max = min+1;
  var padTop = 22, padBottom = 26, padLeft = 12, padRight = 12;
  var W = 620, H = 200;
  var innerW = W-padLeft-padRight, innerH = H-padTop-padBottom;
  var n = months.length;
  function x(i){ return padLeft + (innerW*i)/(n-1); }
  function y(v){ return padTop + innerH - ((v-min)/(max-min))*innerH; }
  var pts = months.map(function(m,i){ return [x(i), y(m.value)]; });
  var path = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
  var area = path + ' L'+pts[n-1][0].toFixed(1)+','+(padTop+innerH)+' L'+pts[0][0].toFixed(1)+','+(padTop+innerH)+' Z';
  var zeroY = (min<=0 && max>=0) ? y(0) : null;
  var labels = months.map(function(m,i){
    return '<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" font-size="10.5" text-anchor="middle" fill="var(--ink-faint)" font-family="Public Sans, sans-serif">'+escapeHtml(m.label)+'</text>';
  }).join('');
  var last = pts[n-1];
  /* max-width : sans elle, la courbe s'étire en hauteur sur grand écran
     et occupe la moitié de la page pour six points. */
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:visible;max-width:680px;margin:0 auto" role="img" aria-label="Évolution du solde sur 6 mois">';
  svg += '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">'+
         '<stop offset="0%" stop-color="var(--lavender)" stop-opacity="0.28"/>'+
         '<stop offset="100%" stop-color="var(--lavender)" stop-opacity="0.02"/></linearGradient></defs>';
  if(zeroY!==null){
    svg += '<line x1="'+padLeft+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-padRight)+'" y2="'+zeroY.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
  }
  svg += '<path d="'+area+'" fill="url(#areaGrad)" stroke="none"/>';
  svg += '<path d="'+path+'" fill="none" stroke="var(--lavender)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  svg += labels;
  svg += '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.2" fill="var(--lavender)"/>';
  svg += '<text x="'+last[0].toFixed(1)+'" y="'+(last[1]-11).toFixed(1)+'" font-size="11.5" text-anchor="end" fill="var(--lavender)" font-weight="600" font-family="IBM Plex Mono, monospace">'+escapeHtml(fmtMoney(months[n-1].value))+'</text>';
  svg += '</svg>';
  return svg;
}

    c.innerHTML =
      '<div class="card hero">'+
        '<div class="hero-label">Solde total</div>'+
        '<div class="hero-value mono">'+fmtMoney(0)+'</div>'+
      '</div>'+
      '<div class="card card-pad empty">'+
        icon('book')+
        '<p style="margin:6px 0 14px;">Ton grand livre est encore vide. Ajoute ton premier compte pour commencer à suivre tes finances.</p>'+
        '<button class="btn btn-primary" data-act="nav" data-page="accounts">'+icon('plus')+' Ajouter un compte</button>'+
      '</div>';
    return;
  }
  var mk = currentMonthKey();
  var income = monthSum(mk,'income');
  var expense = monthSum(mk,'expense');
  var net = income-expense;
  var catSpend = categorySpend(mk);
  var catEntries = Object.keys(catSpend).map(function(k){return [k,catSpend[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
  var maxCat = catEntries.length ? catEntries[0][1] : 1;

  var targets = state.budget.targets||{};
  var budgetCats = Object.keys(targets).filter(function(k){return targets[k]>0;})
    .map(function(k){ return [k, targets[k], catSpend[k]||0]; })
    .sort(function(a,b){ return (b[2]/b[1]) - (a[2]/a[1]); }).slice(0,6);

  var recent = state.transactions.slice(0,6);
  var upcoming = upcomingOccurrences(5);

  var html = '';
  html += '<div class="card hero">'+
      '<div class="hero-label">Solde total</div>'+
      '<div class="hero-value mono">'+fmtMoney(totalBalance())+'</div>'+
      '<div class="hero-accounts">'+state.accounts.map(function(a){
        return '<div class="acc-pill"><span class="dot" style="background:'+a.color+'"></span>'+escapeHtml(a.name)+'&nbsp;<span class="mono">'+fmtMoney(accountBalance(a))+'</span></div>';
      }).join('')+'</div>'+
    '</div>';

  html += '<div class="stat-row">'+
    '<div class="card stat-tile income"><div class="hero-label">Revenus ce mois-ci</div><div class="stat-value mono">+'+fmtMoney(income)+'</div></div>'+
    '<div class="card stat-tile expense"><div class="hero-label">Dépenses ce mois-ci</div><div class="stat-value mono">-'+fmtMoney(expense)+'</div></div>'+
    '<div class="card stat-tile"><div class="hero-label">Solde du mois</div><div class="stat-value mono" style="color:'+(net>=0?'var(--lavender)':'var(--rose)')+'">'+(net>=0?'+':'')+fmtMoney(net)+'</div></div>'+
  '</div>';

  html += '<div class="card chart-card"><h3>Évolution du solde — 6 derniers mois</h3>'+trendChartSVG()+'</div>';

  html += '<div class="dash-grid">';
  html += '<div class="card panel"><h3>Dépenses par catégorie</h3>'+
    (catEntries.length ? catEntries.map(function(e){
      var pct = Math.max(4, Math.round(e[1]/maxCat*100));
      return '<div class="bar-row"><span class="faint">'+escapeHtml(e[0])+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--rose)"></div></div><span class="amt mono">'+fmtMoney(e[1])+'</span></div>';
    }).join('') : '<div class="empty">Aucune dépense ce mois-ci pour le moment.</div>')+
  '</div>';
  html += '<div class="card panel"><h3>Budget du mois</h3>'+
    (budgetCats.length ? budgetCats.map(function(e){
      var pct = Math.min(100, Math.round(e[2]/e[1]*100));
      var ratio = e[2]/e[1];
      var color = ratio>=1?'var(--rose)':(ratio>=0.85?'var(--honey)':'var(--lavender)');
      return '<div class="bar-row"><span class="faint">'+escapeHtml(e[0])+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div><span class="amt mono">'+fmtMoney(e[2])+' / '+fmtMoney(e[1])+'</span></div>';
    }).join('') : '<div class="empty">Définis des objectifs dans l’onglet Budget pour les suivre ici.</div>')+
  '</div>';
  html += '</div>';

  if(upcoming.length){
    html += '<div class="card panel"><h3>Prélèvements à venir</h3>'+
      upcoming.map(function(x){
        return '<div class="bar-row" style="grid-template-columns:90px 1fr auto;">'+
          '<span class="faint mono small">'+fmtDate(x.date)+'</span>'+
          '<span>'+escapeHtml(x.rule.note||x.rule.category)+'</span>'+
          '<span class="amt mono '+(x.rule.type==='income'?'pos':'neg')+'">'+(x.rule.type==='income'?'+':'-')+fmtMoney(x.rule.amount)+'</span>'+
        '</div>';
      }).join('')+
      '<p class="faint small" style="margin:10px 0 0;">Ces montants ne sont pas encore déduits de ton solde — ils le seront le jour de leur échéance.</p>'+
    '</div>';
  }

  html += '<div class="card panel"><h3>Transactions récentes</h3>'+
    (recent.length ? '<div class="table-wrap"><table><tbody>'+recent.map(function(tx){
      return '<tr><td class="faint small" style="white-space:nowrap;">'+fmtDate(tx.date)+'</td>'+
        '<td><span class="dot" style="background:'+accountColor(tx.accountId)+';display:inline-block;margin-right:6px;"></span>'+escapeHtml(accountName(tx.accountId))+'</td>'+
        '<td><span class="cat-chip">'+escapeHtml(tx.category)+'</span></td>'+
        '<td class="amt '+(tx.type==='income'?'pos':'neg')+'">'+(tx.type==='income'?'+':'-')+fmtMoney(tx.amount)+'</td></tr>';
    }).join('')+'</tbody></table></div>' : '<div class="empty">Pas encore de transaction.</div>')+
  '</div>';

  c.innerHTML = html;
}

/* ---------- transactions ---------- */
function filteredTransactions(){
  var f = state.txFilters;
  return state.transactions.filter(function(tx){
    if(f.account!=='all' && tx.accountId!==f.account) return false;
    if(f.category!=='all' && tx.category!==f.category) return false;
    if(f.type!=='all' && tx.type!==f.type) return false;
    if(f.search){
      var s = f.search.toLowerCase();
      var hay = (tx.category+' '+(tx.note||'')+' '+accountName(tx.accountId)).toLowerCase();
      if(hay.indexOf(s)===-1) return false;
    }
    return true;
  });
}

/* ---------- budget ---------- */
function renderBudgetPage(){
  var c = document.getElementById('content');
  var mk = currentMonthKey();
  var spend = categorySpend(mk);
  var targets = state.budget.targets||{};
  var cats = allExpenseCategories();
  var html = '<div class="page-head"><div><p class="muted">Objectifs mensuels par catégorie de dépense — ils se renouvellent chaque mois.</p></div></div>';
  html += '<div class="card card-pad">';
  if(cats.length===0){
    html += '<div class="empty">Ajoute des dépenses pour voir apparaître des catégories ici.</div>';
  } else {
    html += cats.map(function(cat){
      var target = targets[cat]||0;
      var spent = spend[cat]||0;
      var pct = target>0 ? Math.min(100, Math.round(spent/target*100)) : 0;
      var ratio = target>0 ? spent/target : 0;
      var status = target===0 ? null : (ratio>=1?'over':(ratio>=0.85?'warn':'ok'));
      var statusLabel = {over:'Dépassé', warn:'Presque atteint', ok:'Sous contrôle'}[status];

function downloadFile(filename, text, mime){
  try{
    var blob = new Blob([text], {type: mime||'application/octet-stream'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  } catch(err){
    showToast("Échec du téléchargement : "+((err&&err.message)||'erreur inconnue'), true);
    return false;
  }
}
function exportCSV(){
  var rows = [['Date','Compte','Type','Catégorie','Montant','Note']];
  state.transactions.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(tx){
    rows.push([tx.date, accountName(tx.accountId), tx.type==='income'?'Revenu':'Dépense', tx.category, (tx.type==='income'?'':'-')+tx.amount.toFixed(2), tx.note||'']);
  });
  var csv = rows.map(function(r){

  /* BOM en tête : sans lui, Excel affiche « DÃ©penses » au lieu de « Dépenses » */
  if(downloadFile('grand-livre-transactions.csv', '﻿'+csv, 'text/csv;charset=utf-8')){

  }
}

/* ================= SYNCHRONISATION ENTRE APPAREILS =================
   Les données vivent dans un fichier JSON d'un dépôt GitHub privé. Chaque
   appareil garde sa copie locale et fusionne ligne à ligne : personne n'écrase
   le travail de l'autre, même après une saisie hors ligne des deux côtés. */

function indexById(list){
  var m = {};
  (list||[]).forEach(function(r){ if(r && r.id) m[r.id] = r; });
  return m;
}

/* Fusion d'une collection. Pour chaque identifiant, on compare la date du
   dernier événement de chaque côté — modification ou suppression — et le plus
   récent l'emporte. Une suppression récente bat donc une vieille modification,
   et inversement. */
function mergeCollection(localList, localTombs, remoteList, remoteTombs){
  var L = indexById(localList), R = indexById(remoteList);
  var lt = localTombs || {}, rt = remoteTombs || {};
  var ids = {};
  [Object.keys(L), Object.keys(R), Object.keys(lt), Object.keys(rt)].forEach(function(keys){
    keys.forEach(function(id){ ids[id] = 1; });
  });

  var records = [], tombstones = {};
  Object.keys(ids).forEach(function(id){
    var lRec = L[id], rRec = R[id];
    var lDel = lt[id] || 0, rDel = rt[id] || 0;
    var lTime = Math.max(lRec ? (lRec.updatedAt||0) : 0, lDel);
    var rTime = Math.max(rRec ? (rRec.updatedAt||0) : 0, rDel);
    var useLocal = lTime >= rTime;
    var rec = useLocal ? lRec : rRec;
    var del = useLocal ? lDel : rDel;
    var recTime = rec ? (rec.updatedAt||0) : -1;
    if(del && del >= recTime) tombstones[id] = Math.max(lDel, rDel);
    else if(rec) records.push(rec);
  });
  return {records:records, tombstones:tombstones};
}

/* Les objectifs de budget se fusionnent catégorie par catégorie. */
function mergeBudget(localB, remoteB){
  var lTar = (localB && localB.targets) || {}, rTar = (remoteB && remoteB.targets) || {};
  var lts = (localB && localB.ts) || {}, rts = (remoteB && remoteB.ts) || {};
  var cats = {};
  [lTar, rTar, lts, rts].forEach(function(m){ Object.keys(m).forEach(function(c){ cats[c] = 1; }); });
  var targets = {}, ts = {};
  Object.keys(cats).forEach(function(c){
    var lTime = lts[c] || 0, rTime = rts[c] || 0;
    var src = (lTime >= rTime) ? lTar : rTar;
    if(lTime || rTime) ts[c] = Math.max(lTime, rTime);
    if(src[c] > 0) targets[c] = src[c];
  });
  return {targets:targets, ts:ts};
}

function mergeRemoteIntoState(remote){
  remote = remote || {};
  var rTomb = remote.tombstones || {};
  var a = mergeCollection(state.accounts, tombs('accounts'), remote.accounts, rTomb.accounts);
  var t = mergeCollection(state.transactions, tombs('transactions'), remote.transactions, rTomb.transactions);
  var r = mergeCollection(state.recurring, tombs('recurring'), remote.recurring, rTomb.recurring);
  state.accounts = a.records;
  state.transactions = t.records.sort(function(x,y){ return x.date<y.date?1:(x.date>y.date?-1:0); });
  state.recurring = r.records;
  state.tombstones = {accounts:a.tombstones, transactions:t.tombstones, recurring:r.tombstones};
  state.budget = mergeBudget(state.budget, remote.budget);
}

/* Empreinte stable d'un jeu de données : sert à savoir si la fusion a changé
   quelque chose par rapport au fichier distant, donc s'il faut le réécrire. */
function signature(payload){
  function collSig(list, tomb){
    var a = (list||[]).map(function(r){ return r.id+':'+(r.updatedAt||0); }).sort().join(',');
    var b = Object.keys(tomb||{}).sort().map(function(k){ return k+'!'+tomb[k]; }).join(',');
    return a+'|'+b;
  }
  var tb = payload.tombstones || {};
  var bud = payload.budget || {};
  var bts = Object.keys(bud.ts||{}).sort().map(function(k){ return k+':'+bud.ts[k]; }).join(',');
  var btar = Object.keys(bud.targets||{}).sort().map(function(k){ return k+'='+bud.targets[k]; }).join(',');
  return [
    collSig(payload.accounts, tb.accounts),
    collSig(payload.transactions, tb.transactions),
    collSig(payload.recurring, tb.recurring),
    bts, btar
  ].join('||');
}

/* ---------- réglages de synchro (stockés à part des données) ---------- */

    }

}
function saveSyncSettings(){

    }));
  }catch(err){ /* rien à faire : la synchro repartira au prochain chargement */ }
}
function syncConfigured(){ return !!(sync.token && sync.owner && sync.repo && sync.path); }

/* ---------- appels à l'API GitHub ----------
   Le jeton ne quitte cet appareil que vers api.github.com. */
var GH_API = 'https://api.github.com';
function ghHeaders(extra){
  var h = {
    'Authorization': 'Bearer '+sync.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  if(extra) Object.keys(extra).forEach(function(k){ h[k] = extra[k]; });
  return h;
}
function contentsUrl(){
  return GH_API+'/repos/'+encodeURIComponent(sync.owner)+'/'+encodeURIComponent(sync.repo)+
         '/contents/'+sync.path.split('/').map(encodeURIComponent).join('/');
}
/* Encodage base64 qui respecte les accents (Épargne, Santé…). */
function encodeB64(str){
  var bytes = new TextEncoder().encode(str), bin = '';
  for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function decodeB64(b64){
  var bin = atob(String(b64||'').replace(/\s/g,''));
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function ghMessage(res, body){
  if(res.status===401) return "Jeton refusé par GitHub : il est peut-être expiré ou révoqué.";
  if(res.status===403) return "Accès refusé : vérifie que le jeton a bien le droit d'écriture sur ce dépôt.";
  if(res.status===404) return "Dépôt ou fichier introuvable : vérifie le nom du compte, du dépôt et de la branche.";
  var m = '';
  try{ m = (JSON.parse(body)||{}).message || ''; }catch(e){}
  return 'GitHub a répondu '+res.status+(m?' : '+m:'');
}
function ghFetchData(){
  var url = contentsUrl()+'?ref='+encodeURIComponent(sync.branch)+'&nocache='+Date.now();
  return fetch(url, {headers:ghHeaders(), cache:'no-store'}).then(function(res){
    if(res.status===404) return {missing:true};
    if(!res.ok) return res.text().then(function(t){ throw new Error(ghMessage(res,t)); });
    return res.json().then(function(j){
      var data = null;
      try{ data = JSON.parse(decodeB64(j.content)); }
      catch(e){ throw new Error("Le fichier de données du dépôt est illisible (JSON invalide)."); }
      return {sha:j.sha, data:data};
    });
  });
}
function ghWriteData(jsonText, sha){
  var body = {
    message: 'Grand Livre — '+new Date().toISOString().slice(0,19).replace('T',' '),
    content: encodeB64(jsonText),
    branch: sync.branch
  };
  if(sha) body.sha = sha;
  return fetch(contentsUrl(), {
    method:'PUT',
    headers: ghHeaders({'Content-Type':'application/json'}),
    body: JSON.stringify(body)
  }).then(function(res){
    /* 409/422 : quelqu'un d'autre a écrit entre-temps. On refusionnera. */
    if(res.status===409 || res.status===422){ var e = new Error('conflit'); e.conflict = true; throw e; }
    if(!res.ok) return res.text().then(function(t){ throw new Error(ghMessage(res,t)); });
    return res.json().then(function(j){ return (j.content||{}).sha || null; });
  });
}

/* ---------- cycle de synchronisation ---------- */
function setSyncStatus(status, message){
  sync.status = status;
  sync.message = message || '';
  renderSyncIndicator();
  if(state.page==='settings') renderSyncPanel();
}
function queueSync(){
  if(!syncConfigured()) return;
  sync.dirty = true;
  saveSyncSettings();
  renderSyncIndicator();
  clearTimeout(syncTimer);
  /* on laisse retomber les saisies rapprochées avant d'écrire */
  syncTimer = setTimeout(function(){ syncNow(); }, 1500);
}
function syncNow(manual, attempt){
  attempt = attempt || 0;
  if(!syncConfigured()){
    if(manual) showToast("La synchronisation n'est pas encore configurée.", true);
    return Promise.resolve(false);
  }
  if(sync.status==='syncing'){ sync.dirty = true; return Promise.resolve(false); }
  if(!navigator.onLine){
    setSyncStatus('offline', "Hors ligne. Tes saisies partiront dès le retour du réseau.");
    return Promise.resolve(false);
  }
  var hadLocalChanges = sync.dirty;
  sync.dirty = false;
  setSyncStatus('syncing', 'Synchronisation en cours…');

  return ghFetchData().then(function(remote){
    var payload, text;
    if(remote.missing){
      /* premier envoi : le fichier n'existe pas encore dans le dépôt */
      payload = dataPayload();
      text = JSON.stringify(payload, null, 2);
      return ghWriteData(text, null).then(function(newSha){ return {sha:newSha, pushed:true}; });
    }
    var remoteSig = signature(remote.data || {});
    mergeRemoteIntoState(remote.data);
    normalizeState();
    materializeRecurring();
    persist({noSync:true});
    refreshAfterSync();
    payload = dataPayload();
    var mergedSig = signature(payload);
    if(hadLocalChanges || mergedSig !== remoteSig){
      text = JSON.stringify(payload, null, 2);
      return ghWriteData(text, remote.sha).then(function(newSha){ return {sha:newSha, pushed:true}; });
    }
    return {sha:remote.sha, pushed:false};
  }).then(function(res){
    sync.sha = res.sha;
    sync.lastSyncAt = new Date().toISOString();
    saveSyncSettings();
    setSyncStatus('idle', '');
    if(manual) showToast(res.pushed ? 'Synchronisé avec GitHub.' : 'Déjà à jour.');
    /* une saisie arrivée pendant l'envoi : on repart pour un tour */
    if(sync.dirty && attempt < 3) return syncNow(false, attempt+1);
    return true;
  }).catch(function(err){
    sync.dirty = hadLocalChanges || sync.dirty;
    saveSyncSettings();
    if(err && err.conflict && attempt < 3){
      /* Le fichier a bougé entre la lecture et l'écriture : on refusionne.
         Il faut relâcher le verrou avant de repartir, sinon le tour suivant
         se verrait refusé par la garde « déjà en cours » et l'envoi serait
         abandonné en silence. */
      sync.status = 'idle';
      sync.dirty = true;
      return syncNow(manual, attempt+1);
    }
    var offline = !navigator.onLine || (err && /Failed to fetch|NetworkError|Load failed/i.test(err.message||''));
    if(offline){
      setSyncStatus('offline', "Hors ligne. Tes saisies partiront dès le retour du réseau.");
    } else {
      setSyncStatus('error', (err && err.message) || 'Erreur inconnue.');
      if(manual) showToast('Échec de la synchronisation : '+((err&&err.message)||'erreur inconnue'), true);
    }
    return false;
  });
}
function refreshAfterSync(){
  renderNav();
  renderPageShell();
  renderBackupBanner();
  renderSyncIndicator();
}

/* ---------- rappel de sauvegarde ---------- */
var REMIND_AFTER_DAYS = 14;   /* on relance si la dernière sauvegarde date de plus de 2 semaines */
var SNOOZE_DAYS = 3;          /* « Plus tard » = on se tait pendant 3 jours */
var MIN_ENTRIES_BEFORE_FIRST = 3; /* on ne demande rien tant que le grand livre est quasi vide */

function addDays(iso, n){
  var d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  var tz = d.getTimezoneOffset();
  return new Date(d.getTime()-tz*60000).toISOString().slice(0,10);
}
function daysSince(iso){
  if(!iso) return null;
  var a = new Date(iso+'T00:00:00').getTime();
  var b = new Date(todayStr()+'T00:00:00').getTime();
  return Math.round((b-a)/86400000);
}
function backupMeta(){
  if(!state.meta || typeof state.meta !== 'object') state.meta = {lastExportAt:null, snoozeUntil:null};
  return state.meta;
}
function shouldRemindBackup(){
  if(!state.storageAvailable) return false;
  /* Quand la synchro GitHub fonctionne, les données sont déjà à l'abri ailleurs :
     inutile de réclamer en plus une sauvegarde manuelle. */
  if(syncConfigured() && sync.status !== 'error') return false;
  var m = backupMeta();
  var entries = state.accounts.length + state.transactions.length;
  if(entries === 0) return false;
  if(m.snoozeUntil && todayStr() < m.snoozeUntil) return false;
  if(!m.lastExportAt) return entries >= MIN_ENTRIES_BEFORE_FIRST;
  var since = daysSince(m.lastExportAt);
  return since !== null && since >= REMIND_AFTER_DAYS;
}
function renderBackupBanner(){
  var el = document.getElementById('backup-banner');
  if(!el) return;
  if(!shouldRemindBackup()){ el.hidden = true; return; }
  var m = backupMeta();
  var sub = document.getElementById('backup-sub');
  if(!m.lastExportAt){
    sub.textContent = "Tu n'as encore jamais exporté de copie. Si ce téléphone efface le stockage du navigateur, tout serait perdu.";
  } else {
    var since = daysSince(m.lastExportAt);
    sub.textContent = 'Dernière sauvegarde il y a '+since+' jour'+(since>1?'s':'')+'. Une copie récente te protège en cas de problème.';
  }
  el.hidden = false;
}
function markExported(){
  var m = backupMeta();
  m.lastExportAt = todayStr();
  m.snoozeUntil = null;
  persist();
  renderBackupBanner();
}
function snoozeBackupReminder(){
  var m = backupMeta();
  m.snoozeUntil = addDays(todayStr(), SNOOZE_DAYS);
  persist();
  renderBackupBanner();
}

/* ---------- sauvegarde / restauration (JSON) ---------- */
var pendingImport = null;
function exportData(){
  var payload = dataPayload();
  payload.exportedAt = new Date().toISOString();
  var json = JSON.stringify(payload, null, 2);
  if(downloadFile('grand-livre-sauvegarde-'+todayStr()+'.json', json, 'application/json')){
    markExported();
    showToast('Sauvegarde téléchargée.');
  }
}
function importDataFromFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object') throw new Error('format invalide');
      var imp = {
        accounts: Array.isArray(data.accounts) ? data.accounts : [],
        transactions: Array.isArray(data.transactions) ? data.transactions : [],
        recurring: Array.isArray(data.recurring) ? data.recurring : [],
        budget: (data.budget && typeof data.budget==='object') ? data.budget : {targets:{}},
        tombstones: (data.tombstones && typeof data.tombstones==='object') ? data.tombstones : null
      };
      if(!imp.budget.targets) imp.budget.targets = {};
      pendingImport = imp;
      document.getElementById('import-summary').textContent =
        imp.accounts.length+' compte(s), '+imp.transactions.length+' transaction(s), '+imp.recurring.length+' récurrence(s) trouvés dans ce fichier.';
      document.getElementById('import-confirm').hidden = false;
    } catch(err){
      showToast("Impossible de lire ce fichier : format invalide ou corrompu.", true);
    }
  };
  reader.onerror = function(){ showToast("Impossible de lire ce fichier.", true); };
  reader.readAsText(file);
}
function applyPendingImport(){
  if(!pendingImport) return;
  var t = now();

  /* L'import est un geste délibéré : il doit gagner la fusion suivante. On date
     donc tout le contenu importé de maintenant, et on marque comme supprimé ce
     qui existait ici sans figurer dans le fichier — sans quoi la synchro
     rapatrierait depuis GitHub les lignes que l'import voulait justement
     remplacer. */
  ['accounts','transactions','recurring'].forEach(function(kind){
    var importedIds = {};
    pendingImport[kind].forEach(function(r){ r.updatedAt = t; if(r.id) importedIds[r.id] = 1; });
    var graveyard = tombs(kind);
    (state[kind]||[]).forEach(function(r){ if(r.id && !importedIds[r.id]) graveyard[r.id] = t; });
    Object.keys(importedIds).forEach(function(id){ delete graveyard[id]; });
    if(pendingImport.tombstones && pendingImport.tombstones[kind]){
      Object.keys(pendingImport.tombstones[kind]).forEach(function(id){
        if(!importedIds[id]) graveyard[id] = Math.max(graveyard[id]||0, pendingImport.tombstones[kind][id]||t);
      });
    }
  });

  state.accounts = pendingImport.accounts;
  state.transactions = pendingImport.transactions;
  state.recurring = pendingImport.recurring;
  state.budget = pendingImport.budget;
  if(!state.budget.ts) state.budget.ts = {};
  Object.keys(state.budget.targets||{}).forEach(function(cat){ state.budget.ts[cat] = t; });

  pendingImport = null;
  document.getElementById('import-confirm').hidden = true;
  normalizeState();
  if(persist()){
    materializeRecurring();
    renderNav();
    renderPageShell();
    showToast('Données importées avec succès.');
  }
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-act]');
  if(!btn) return;
  var act = btn.getAttribute('data-act');
  if(act==='nav'){ navigateTo(btn.getAttribute('data-page')); }
  else if(act==='quick-add'){ navigateTo('transactions'); state.showTxForm = true; state.editTxId = null; renderPageShell(); document.getElementById('tf-amount') && document.getElementById('tf-amount').focus(); }
  else if(act==='toggle-account-form'){ state.showAccountForm = !state.showAccountForm; if(!state.showAccountForm) state.editAccountId=null; renderAccountForm(); }
  else if(act==='toggle-tx-form'){ state.showTxForm = !state.showTxForm; if(!state.showTxForm) state.editTxId=null; renderTransactionForm(); }
  else if(act==='toggle-recurring-form'){ state.showRecurringForm = !state.showRecurringForm; if(!state.showRecurringForm) state.editRecurringId=null; renderRecurringForm(); }
  else if(act==='edit-account'){ state.editAccountId = btn.getAttribute('data-id'); state.showAccountForm = true; renderAccountForm(); document.getElementById('account-form-slot').scrollIntoView({behavior:'smooth', block:'start'}); }
  else if(act==='edit-tx'){ state.editTxId = btn.getAttribute('data-id'); state.showTxForm = true; renderTransactionForm(); document.getElementById('tx-form-slot').scrollIntoView({behavior:'smooth', block:'start'}); }
  else if(act==='edit-recurring'){ state.editRecurringId = btn.getAttribute('data-id'); state.showRecurringForm = true; renderRecurringForm(); document.getElementById('recurring-form-slot').scrollIntoView({behavior:'smooth', block:'start'}); }
  else if(act==='toggle-recurring-active'){ toggleRecurringActive(btn.getAttribute('data-id')); renderRecurringList(); }
  else if(act==='del-account'){
    var id = btn.getAttribute('data-id'); var key = 'acc:'+id;
    if(armed.has(key)){ armed.delete(key); deleteAccount(id); renderAccountsGrid(); }
    else { armed.add(key); renderAccountsGrid(); setTimeout(function(){ if(armed.has(key)){ armed.delete(key); renderAccountsGrid(); } }, 4000); }
  }
  else if(act==='del-tx'){
    var tid = btn.getAttribute('data-id'); var tkey = 'tx:'+tid;
    if(armed.has(tkey)){ armed.delete(tkey); deleteTransaction(tid); renderTransactionsTable(); }
    else { armed.add(tkey); renderTransactionsTable(); setTimeout(function(){ if(armed.has(tkey)){ armed.delete(tkey); renderTransactionsTable(); } }, 4000); }
  }
  else if(act==='del-recurring'){
    var rid = btn.getAttribute('data-id'); var rkey = 'rec:'+rid;
    if(armed.has(rkey)){ armed.delete(rkey); deleteRecurring(rid); renderRecurringList(); }
    else { armed.add(rkey); renderRecurringList(); setTimeout(function(){ if(armed.has(rkey)){ armed.delete(rkey); renderRecurringList(); } }, 4000); }
  }
  else if(act==='export-json'){ exportData(); }
  else if(act==='export-csv'){ exportCSV(); }
  else if(act==='backup-now'){ exportData(); }
  else if(act==='backup-later'){ snoozeBackupReminder(); }
  else if(act==='sync-now'){ syncNow(true); }
  else if(act==='sync-forget'){
    if(armed.has('sync-forget')){
      armed.delete('sync-forget');
      sync.token = ''; sync.sha = null; sync.lastSyncAt = null; sync.dirty = false;
      saveSyncSettings();
      setSyncStatus('off','');
      renderSettingsPage();
      showToast("Jeton effacé de cet appareil. Tes données y restent enregistrées.");
    } else {
      armed.add('sync-forget');
      btn.textContent = 'Confirmer l’oubli';
      btn.classList.add('btn-primary');
      setTimeout(function(){
        if(armed.has('sync-forget')){ armed.delete('sync-forget'); if(state.page==='settings') renderSyncPanel(); }
      }, 4000);
    }
  }
  else if(act==='confirm-import'){ applyPendingImport(); }
  else if(act==='cancel-import'){ pendingImport = null; document.getElementById('import-confirm').hidden = true; }
});

document.addEventListener('change', function(e){
  if(e.target.id==='import-file-input'){
    var f = e.target.files && e.target.files[0];
    importDataFromFile(f);
    e.target.value = '';
  }
});

document.addEventListener('submit', function(e){
  var form = e.target;
  if(form.id==='sync-form'){
    e.preventDefault();
    var f = new FormData(form);
    sync.owner = (f.get('owner')||'').trim();
    sync.repo = (f.get('repo')||'').trim();
    sync.path = (f.get('path')||'').trim() || 'grand-livre.json';
    sync.branch = (f.get('branch')||'').trim() || 'main';
    var newToken = (f.get('token')||'').trim();
    if(newToken !== sync.token){ sync.token = newToken; sync.sha = null; }
    saveSyncSettings();
    if(!syncConfigured()){
      setSyncStatus('off','');
      renderSettingsPage();
      showToast('Il manque une information pour activer la synchronisation.', true);
      return;
    }
    setSyncStatus('idle','');
    renderSettingsPage();
    syncNow(true);
    return;
  }
  if(form.id==='account-form'){
    e.preventDefault();
    var fd = new FormData(form);
    var data = {
      name: fd.get('name').trim(),
      type: fd.get('type'),
      initialBalance: parseFloat(fd.get('initialBalance'))||0,
      color: fd.get('color')||PALETTE[0]
    };
    if(!data.name) return;
    var editId = form.getAttribute('data-edit-id');
    if(editId){ updateAccount(editId, data); } else { createAccount(data); }
    state.showAccountForm = false; state.editAccountId = null;
    renderAccountForm();
    renderAccountsGrid();
  }
  else if(form.id==='tx-form'){
    e.preventDefault();
    var fd2 = new FormData(form);
    var data2 = {
      type: fd2.get('type'),
      accountId: fd2.get('accountId'),
      amount: Math.abs(parseFloat(fd2.get('amount'))||0),
      date: fd2.get('date'),
      category: (fd2.get('category')||'').trim(),
      note: (fd2.get('note')||'').trim()
    };
    if(!data2.amount || !data2.category || !data2.accountId) return;
    var editId2 = form.getAttribute('data-edit-id');
    if(editId2){ updateTransaction(editId2, data2); } else { createTransaction(data2); }
    state.showTxForm = false; state.editTxId = null;
    renderTransactionForm();
    renderTransactionsTable();
  }
  else if(form.getAttribute && form.getAttribute('data-act')==='save-budget'){
    e.preventDefault();
    var cat = form.getAttribute('data-cat');
    var val = parseFloat(new FormData(form).get('target'))||0;
    saveBudgetTarget(cat, val);
    renderBudgetPage();
  }
  else if(form.id==='recurring-form'){
    e.preventDefault();
    var fd3 = new FormData(form);
    var day = Math.min(31, Math.max(1, parseInt(fd3.get('day'),10)||1));
    var data3 = {
      type: fd3.get('type'),
      accountId: fd3.get('accountId'),
      amount: Math.abs(parseFloat(fd3.get('amount'))||0),
      day: day,
      startDate: fd3.get('startDate'),
      category: (fd3.get('category')||'').trim(),
      note: (fd3.get('note')||'').trim()
    };
    if(!data3.amount || !data3.category || !data3.accountId || !data3.startDate) return;
    var editId3 = form.getAttribute('data-edit-id');
    if(editId3){ updateRecurring(editId3, data3); } else { createRecurring(data3); }
    state.showRecurringForm = false; state.editRecurringId = null;
    renderRecurringForm();
    renderRecurringList();
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id==='tf-category'){ return; }
  if(t.name==='type' && t.closest('#tx-form')){
    var catInput = document.getElementById('tf-category');
    if(catInput) catInput.setAttribute('list', t.value==='income'?'dl-income':'dl-expense');
  }
  if(t.name==='type' && t.closest('#recurring-form')){
    var rCatInput = document.getElementById('rf-category');
    if(rCatInput) rCatInput.setAttribute('list', t.value==='income'?'dl-income':'dl-expense');
  }
  if(t.name==='color' && t.closest('#account-form')){
    t.closest('form').querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('selected'); });
    t.closest('.swatch').classList.add('selected');
  }
  if(t.id==='f-account'){ state.txFilters.account = t.value; renderTransactionsTable(); }
  if(t.id==='f-type'){ state.txFilters.type = t.value; renderTransactionsTable(); }
  if(t.id==='f-category'){ state.txFilters.category = t.value; renderTransactionsTable(); }
});
document.addEventListener('input', function(e){
  if(e.target.id==='f-search'){ state.txFilters.search = e.target.value; renderTransactionsTable(); }
});

/* ---------- hors-ligne : indicateur ---------- */
function updateOfflineBadge(){
  var b = document.getElementById('offline-badge');
  if(b) b.hidden = navigator.onLine;
  renderSyncIndicator();
}
window.addEventListener('offline', function(){
  updateOfflineBadge();
  if(syncConfigured()) setSyncStatus('offline', "Hors ligne. Tes saisies partiront dès le retour du réseau.");
});
window.addEventListener('online', function(){
  updateOfflineBadge();
  /* le réseau revient : on rattrape ce qui attendait */
  if(syncConfigured()) syncNow();
});
/* revenir sur l'onglet ou rouvrir l'app depuis l'écran d'accueil : on va voir
   si l'autre appareil a écrit quelque chose entre-temps */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && syncConfigured() && navigator.onLine) syncNow();
});

/* ---------- boot ---------- */
document.querySelector('[data-act="quick-add"]').innerHTML = icon('plus')+' Nouvelle transaction';
loadSyncSettings();
loadState();
materializeRecurring();
renderNav();
renderPageShell();
renderBackupBanner();
updateOfflineBadge();
renderSyncIndicator();
if(syncConfigured()) syncNow();

/* mode hors-ligne : contrairement à l'hébergement précédent, GitHub Pages
   laisse fonctionner le service worker */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){
      if(window.console && console.warn) console.warn('[Grand Livre] service worker indisponible', err);
    });
  });
}
})();
